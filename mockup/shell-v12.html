<!doctype html>
<!--
TAG LAB UI CONTRACT v0.5

STATUS
  This file is an interaction specification that happens to run in a browser.
  Layout, feedback, and state transitions are demonstrable. Domain data, persistence,
  NovelAI generation, and external-service adapters are MOCK implementations.

HOW TO READ
  FEATURE     why a visible region exists
  EVENT       user action and the state transition it must cause
  STATE       durable or transient values the implementation must own
  INVARIANT   rule that must never be broken by a real implementation
  MOCK        sample-only content that must be replaced, never inferred as product truth
  TODO        missing production work and its expected boundary
  ACCEPTANCE  observable behavior required before the feature is considered implemented

CORE STATE MACHINE
  editing
    -> seed-selected       user explicitly selects one artist
    -> chunk-selection     user opens the chunk experiment for that seed
    -> tournament-running  user chooses an existing chunk or starts a new one
    -> tournament-complete fifteen decisions produce one winner
    -> weight-tuning       future V0.6 stage, not implemented in this file
    -> chunk-saved         future V0.6 stage, not implemented in this file

MINIMUM DOMAIN SHAPES
  Artist      { id, tag, displayName, weight, promptIndex, representativeImage, danbooruUrl, xUrl }
  Chunk       { id, name, artists: [{ artistId, order, weight }], representativeImage, status }
  Match       { id, round, index, leftCandidateId, rightCandidateId, winnerId, decidedAt }
  Tournament  { id, seedArtistId, candidateType, matches, currentMatchId, championId }
  PromptState { rawText, parsedArtists }

GLOBAL INVARIANTS
  1. raw prompt text is the only source of truth for artist order and weight.
  2. seed artist is an explicit user decision; never infer it from the first tag or MOCK data.
  3. sorting changes only the view. It never rewrites prompt order.
  4. changing seed invalidates and clears the active tournament.
  5. a new or selected chunk always starts with clean bracket and history state.
  6. bracket and history are two projections of one Match collection, never separate datasets.
  7. current/latest history appears above older history.
  8. all motion explains a state transition and honors prefers-reduced-motion.
-->
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tag Lab v0.5 — 주석형 UI 구현 명세</title>
<style>
  /* ── NAI 공식 페이지의 결: 짙은 남색 바닥, 촘촘한 여백, 강조는 노란 버튼 하나 ── */
  :root{
    --bg:#0c0e13; --panel:#151920; --panel2:#1b202a; --line:#252b36;
    --ink:#dfe4ec; --dim:#7b8494; --hole:#1a1f28;
    --accent:#f0c440; --sel:#2c4a7a;
    --fs:13px; --gap:6px; --r:6px;
  }
  html[data-theme="light"]{
    --bg:#eef0f4; --panel:#ffffff; --panel2:#f3f5f9; --line:#d6dae2;
    --ink:#1b1f27; --dim:#767f8d; --hole:#e9ecf1; --accent:#d9a712; --sel:#cfe0fb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:system-ui,"Segoe UI","Malgun Gothic",sans-serif;
    font-size:var(--fs); line-height:1.5;
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* ── 상단 툴바 ── */
  .top{
    position:relative; flex:0 0 auto; height:40px; display:flex; align-items:center; gap:8px;
    padding:0 8px; background:var(--panel); border-bottom:1px solid var(--line);
  }
  .brand{font-weight:700; letter-spacing:-.3px; padding-right:4px}
  .chip{
    display:flex; align-items:center; gap:6px; padding:3px 9px;
    background:var(--panel2); border:1px solid var(--line); border-radius:var(--r);
    color:var(--dim); font-size:.9em;
  }
  .chip b{color:var(--ink); font-weight:600}
  .top .spacer{flex:1}
  .ico{
    font:inherit; color:var(--dim); background:transparent; border:1px solid transparent;
    border-radius:var(--r); padding:3px 8px; cursor:pointer;
  }
  .ico:hover,.ico.on{color:var(--ink); background:var(--panel2); border-color:var(--line)}
  .tournament-status{
    display:none; position:absolute; z-index:3; left:50%; top:50%; transform:translate(-50%,-50%);
    min-width:148px; padding:4px 12px; border:1px solid #f0c44088; border-radius:var(--r);
    color:var(--ink); background:var(--panel2); text-align:center; font-weight:700;
    font-variant-numeric:tabular-nums; white-space:nowrap; box-shadow:0 0 16px #f0c44012;
  }
  .tournament-status span{color:var(--dim); font-weight:600}
  .tournament-status b{color:var(--accent)}
  body.chunkDuel .tournament-status{display:block}
  body.chunkDuel .top-mid{opacity:0; pointer-events:none}

  /* ── 4열 무대 ── */
  .stage{flex:1 1 auto; display:flex; min-height:0; padding:var(--gap); gap:0}
  .col{display:flex; flex-direction:column; min-width:0; min-height:0}
  #sideL{flex:0 0 320px}
  #mainL{flex:1 1 55%}
  #mainR{flex:1 1 45%}
  #sideR{flex:0 0 132px}
  /* 사이드바는 위에서 아래까지 온전히 자기 옆면을 갖는다.
     바닥 그래프는 가운데 기둥 안에서만 살고, 사이드바 아래로는 넘어오지 않는다 */
  #center{flex:1 1 auto; display:flex; flex-direction:column; min-width:0; min-height:0}
  .mains{flex:1 1 auto; display:flex; min-width:0; min-height:0}
  body.noL #sideL,body.noL #spL{display:none}
  body.noR #sideR,body.noR #spR{display:none}

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
    display:flex; flex-direction:column; min-height:0; overflow:hidden;
  }
  .panel+.panel{margin-top:var(--gap)}
  .phead{
    flex:0 0 auto; display:flex; align-items:center; gap:6px;
    padding:5px 8px; border-bottom:1px solid var(--line);
    color:var(--dim); font-size:.86em;
  }
  .phead .spacer{flex:1}
  .pbody{flex:1 1 auto; min-height:0; overflow:auto; padding:8px}
  .pfoot{flex:0 0 auto; border-top:1px solid var(--line); padding:6px 8px}

  .hole{
    height:100%; min-height:48px; border-radius:var(--r); background:var(--hole);
    display:flex; align-items:center; justify-content:center;
    color:var(--dim); font-size:.85em; text-align:center; padding:8px;
  }

  /* ── 칸 사이 손잡이 ── */
  .split{flex:0 0 var(--gap); cursor:col-resize; position:relative}
  .split::after{content:""; position:absolute; inset:0 1px; border-radius:2px}
  .split:hover::after{background:var(--accent); opacity:.4}
  .split.v{cursor:row-resize}
  .split.v::after{inset:1px 0}

  /* ── 왼쪽 사이드바 ── */
  .row{display:flex; align-items:center; gap:6px}
  .sel{
    font:inherit; color:var(--ink); background:var(--panel2);
    border:1px solid var(--line); border-radius:var(--r); padding:3px 6px;
  }
  .tabs{display:flex; gap:2px; flex:0 0 auto}
  .tab{
    font:inherit; color:var(--dim); background:transparent; border:none;
    padding:4px 9px; border-radius:var(--r) var(--r) 0 0; cursor:pointer;
  }
  .tab.on{color:var(--ink); background:var(--panel2)}
  .tabbody{display:none; flex:1 1 auto; min-height:0; flex-direction:column}
  .tabbody.on{display:flex}

  /* ── 프롬프트 글상자 ──
     textarea 안의 글자는 부분 색칠이 안 된다. 그래서 두 겹으로 쌓는다:
     아래 = 색칠한 사본(mirror), 위 = 글자를 투명하게 만든 진짜 textarea.
     커서와 선택은 위층이, 색은 아래층이 담당한다. 둘의 글자 상자는 완전히 같아야 겹친다. */
  .ptwrap{
    flex:0 0 auto; position:relative; overflow:hidden;
    background:var(--panel2); border:1px solid var(--line);
    border-radius:0 var(--r) var(--r) var(--r);
  }
  .ptwrap:focus-within{border-color:var(--accent)}
  .ptmirror,.pt{
    position:absolute; inset:0; width:100%; height:100%;
    font:inherit; font-family:inherit; font-size:inherit; line-height:1.9;
    padding:8px; border:none; background:transparent;
    white-space:pre-wrap; overflow-wrap:break-word; word-break:break-word;
    letter-spacing:inherit; tab-size:2;
  }
  .ptmirror{color:var(--dim); overflow:hidden; pointer-events:none; z-index:0}
  .pt{color:transparent; caret-color:var(--ink); resize:none; outline:none; overflow:auto; z-index:1}
  .pt::selection{background:var(--sel)}
  .ptmirror .tk{border-radius:2px}
  .ptmirror .tk.hi{background:var(--sel)}
  .ptmirror .tk{position:relative}
  .ptmirror .ord{
    position:absolute; left:0; top:-1.02em; min-width:13px; padding:1px 3px;
    border:1px solid color-mix(in srgb,currentColor 45%,transparent);
    border-radius:4px; background:var(--panel); color:inherit;
    font-size:.58em; font-weight:700; line-height:1; text-align:center;
    opacity:.9; pointer-events:none;
  }

  /* ── 목록 = 프롬프트를 읽어서 보여주는 창구 ── */
  .combobar{
    flex:0 0 auto; display:flex; align-items:center; gap:6px;
    padding:6px 3px 4px; color:var(--dim); font-size:.82em;
  }
  .combobar .spacer{flex:1}
  .mini{
    font:inherit; font-size:.95em; color:var(--dim); background:transparent;
    border:1px solid var(--line); border-radius:4px; padding:1px 6px; cursor:pointer;
  }
  .mini:hover{color:var(--ink)}
  .mini.on{color:var(--ink); background:var(--panel2)}
  .pick{
    flex:1 1 0; min-width:0; font:inherit; font-size:.95em;
    color:var(--ink); background:var(--panel2);
    border:1px solid var(--line); border-radius:4px; padding:1px 3px; cursor:pointer;
  }
  #combo{flex:1 1 auto; min-height:0; overflow:auto}

  .arow{
    display:flex; align-items:center; gap:5px; padding:1px 3px;
    border-radius:4px; border-left:3px solid transparent;
  }
  .arow:hover{background:var(--panel2)}
  .arow.dragging,.bar.dragging{opacity:.42}
  .arow.drop-before{box-shadow:0 -2px 0 var(--accent)}
  .arow.drop-after{box-shadow:0 2px 0 var(--accent)}
  .arow.hi{background:var(--panel2); border-left-color:var(--c)}
  .arow .dot{flex:0 0 8px; height:8px; border-radius:50%; background:var(--c)}
  .arow .idx{
    flex:0 0 20px; color:var(--dim); font-size:.72em;
    font-variant-numeric:tabular-nums; text-align:right;
  }
  .arow .nm{
    flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; font-size:.9em; color:var(--c);     /* 글자 자체가 그 작가의 색 */
  }
  .arow.plain .nm{color:var(--dim)}
  /* 지금 조합에서 가장 세게/가장 약하게 누른 작가. 1.0 은 손대지 않은 값이라 제외 */
  .arow.top .nm,.arow.bot .nm,.arow.top .w,.arow.bot .w{font-weight:700}
  /* 지금 정렬 기준이 되는 수치. 왜 이 순서로 섰는지 눈으로 확인하라고 띄운다 */
  .arow .meta{flex:0 0 auto; color:var(--dim); font-size:.78em; font-variant-numeric:tabular-nums}
  .arow .w{
    flex:0 0 50px; text-align:center; font:inherit; font-size:.9em; color:var(--ink);
    background:var(--panel2); border:1px solid var(--line); border-radius:4px; padding:1px 3px;
  }
  .arow.neg .w{color:#ff8f8f}
  .arow .x{flex:0 0 auto; border:none; background:none; color:var(--dim); cursor:pointer; font:inherit}
  .arow .x:hover{color:var(--accent)}

  .genbtn{
    width:100%; font:inherit; font-weight:700; color:#20180a;
    background:var(--accent); border:none; border-radius:var(--r);
    padding:9px; cursor:pointer;
  }
  .genbtn:hover{filter:brightness(1.08)}
  .genbtn:disabled{color:var(--dim); background:var(--panel2); cursor:not-allowed; filter:none}

  /* ── 가운데: 결과 ── */
  .canvas{
    flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:10px;
  }
  .canvas .hole{width:min(100%,420px); aspect-ratio:832/1216; height:auto}
  .barbtn{
    font:inherit; color:var(--dim); background:var(--panel2);
    border:1px solid var(--line); border-radius:var(--r); padding:3px 8px; cursor:pointer;
  }
  .barbtn:hover{color:var(--ink)}

  /* ── 오른쪽 메인: 작가 ── */
  .agrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:6px}
  .agrid div{aspect-ratio:3/4; background:var(--hole); border-radius:4px}
  .find{
    width:100%; font:inherit; color:var(--ink); background:var(--panel2);
    border:1px solid var(--line); border-radius:var(--r); padding:5px 8px; outline:none;
  }
  .find:focus{border-color:var(--accent)}

  /* ── 오른쪽 사이드바: 히스토리 ── */
  .hist{display:flex; flex-direction:column; gap:6px}
  .hist div{aspect-ratio:3/4; background:var(--hole); border-radius:4px}
  .hist div:first-child{outline:2px solid var(--accent); outline-offset:-2px}

  /* ── 바닥 그래프 ── */
  .floor{
    flex:0 0 auto;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
    display:flex; flex-direction:column; overflow:hidden;
  }
  body.noF .floor,body.noF #spF{display:none}
  .bars{
    flex:1 1 auto; min-height:0; display:flex; align-items:stretch; gap:2px;
    padding:14px 10px 0; position:relative; overflow-x:auto;
  }
  .ticks{position:absolute; inset:14px 10px 0; pointer-events:none; z-index:0}
  .tickline{position:absolute; left:0; right:0; border-top:1px dashed var(--line)}
  .tickline.major{border-top-style:solid; border-top-color:var(--dim); opacity:.8}
  .ticklabel{
    position:absolute; left:2px; padding:0 3px; border-radius:3px;
    background:var(--panel); color:var(--dim); font-size:.68em;
    font-variant-numeric:tabular-nums; transform:translateY(50%);
  }
  .graphinfo{
    position:absolute; top:10px; right:10px; z-index:6;
    display:flex; gap:10px; padding:5px 8px;
    background:color-mix(in srgb,var(--panel) 90%,transparent);
    border:1px solid var(--line); border-radius:5px; color:var(--dim);
    font-size:.76em; font-variant-numeric:tabular-nums; pointer-events:none;
    box-shadow:0 4px 14px #0004;
  }
  .graphinfo b{color:var(--ink); font-weight:600}
  .bar{flex:1 1 0; min-width:24px; cursor:ns-resize; position:relative; z-index:2}
  .bar .stem{position:absolute; left:1px; right:1px; background:var(--c); opacity:.75; min-height:2px}
  .bar.pos .stem{border-radius:3px 3px 0 0}
  .bar.neg .stem{border-radius:0 0 3px 3px; opacity:.55}
  .bar:hover .stem,.bar.hi .stem{opacity:1}
  .bar.drop-before{box-shadow:-3px 0 0 var(--accent)}
  .bar.drop-after{box-shadow:3px 0 0 var(--accent)}
  .bar.hi::before{content:""; position:absolute; inset:0; background:var(--c); opacity:.12; border-radius:3px}
  .bar .val{
    position:absolute; left:0; right:0; text-align:center; font-size:.74em;
    color:var(--dim); pointer-events:none; z-index:5;
  }
  .bar.hi .val{color:var(--ink)}
  .names{flex:0 0 auto; display:flex; gap:2px; padding:3px 10px 6px; overflow-x:auto}
  .names span{
    flex:1 1 0; min-width:24px; text-align:center; font-size:.72em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    border-top:2px solid var(--c); padding-top:2px; color:var(--dim); cursor:default;
  }
  .names span.hi{color:var(--ink)}

  .artistpeek{
    position:fixed; z-index:100; width:176px; padding:6px;
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    box-shadow:0 12px 34px #0009; pointer-events:none;
    opacity:0; transform:translateY(5px); transition:opacity .08s,transform .08s;
  }
  .artistpeek.on{opacity:1; transform:translateY(0)}
  .artistpeek img{
    display:block; width:100%; aspect-ratio:832/1216; object-fit:cover;
    border-radius:5px; background:var(--hole);
  }
  .artistpeek .peekname{margin-top:5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .artistpeek .peekmeta{color:var(--dim); font-size:.78em}
  .artistadd{display:flex; gap:4px; padding:0 3px 6px}
  .artistadd input{
    min-width:0; flex:1; font:inherit; color:var(--ink); background:var(--panel2);
    border:1px solid var(--line); border-radius:4px; padding:3px 6px; outline:none;
  }
  .artistadd input:focus{border-color:var(--accent)}
  .arow.seed{background:color-mix(in srgb,var(--accent) 10%,var(--panel2))}
  .arow.seed .idx,.arow.seed .nm{color:var(--accent)}
  .bar.seed{background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .bar.seed .stem{box-shadow:0 0 0 1px var(--accent),0 0 10px #f0c44033}
  .names span.seed{color:var(--accent); font-weight:700}
  .ptmirror .tk.seed{box-shadow:inset 0 -1px 0 var(--accent)}

  /* 평상시 작가 그림과 1단계 청크 선택은 같은 패널의 두 상태다 */
  .main-left-normal,.duel-left,.artist-normal,.chunk-entry,.duel-right,.history-normal,.tournament-history{
    flex:1 1 auto; min-height:0; display:flex; flex-direction:column;
  }
  .main-left-normal>.panel{flex:1 1 auto}
  .duel-left,.chunk-entry,.duel-right,.tournament-history,#tournamentBracket{display:none}
  body.chunkStage .artist-normal{display:none}
  body.chunkStage .chunk-entry{display:flex}
  body.chunkDuel .main-left-normal,body.chunkDuel .chunk-entry{display:none}
  body.chunkDuel .duel-left,body.chunkDuel .duel-right{display:flex}
  body.chunkDuel .history-normal{display:none}
  body.chunkDuel .tournament-history{display:flex}
  body.chunkDuel #bars,body.chunkDuel #names{display:none}
  body.chunkDuel #tournamentBracket{display:flex}
  body.chunkStage #sideR{flex-basis:214px}

  .duelpick{
    position:relative; flex:1 1 auto; min-height:0; padding:8px; overflow:hidden;
    border:0; background:var(--panel); color:var(--ink); cursor:pointer;
  }
  .duelpick img{
    display:block; width:100%; height:100%; object-fit:contain;
    border-radius:5px; background:var(--hole); transition:filter .12s,box-shadow .12s;
  }
  .duelpick:hover img,.duelpick:focus-visible img{box-shadow:0 0 0 1px var(--accent)}
  .duelpick:disabled{cursor:default}
  body.tournamentMoving .duelpick{pointer-events:none}
  body.tournamentMoving #duelExit,body.tournamentMoving #tUndo,body.tournamentMoving #tReset{pointer-events:none;opacity:.3}
  .duelpick.choice-win img{
    box-shadow:0 0 0 2px #5bd197,0 0 30px #5bd19744;
    transform:scale(1.012); transition:transform .18s ease,box-shadow .18s ease;
  }
  .duelpick.choice-win .duelmark{opacity:1; transform:translate(-50%,0); background:#5bd197}
  .duelpick.choice-lose img{
    filter:grayscale(1)!important; opacity:.28; transform:scale(.975);
    transition:filter .18s ease,opacity .18s ease,transform .18s ease;
  }
  .duelpick.empty img{display:none}
  .duelpick.empty::before{
    content:"◆"; position:absolute; inset:0; display:grid; place-items:center;
    color:var(--line); font-size:2em; background:var(--hole);
  }
  .duelmark{
    position:absolute; left:50%; bottom:16px; transform:translate(-50%,4px);
    width:30px; height:30px; display:grid; place-items:center; border-radius:50%;
    color:#211903; background:var(--accent); opacity:0; transition:opacity .12s,transform .12s;
  }
  .duelpick:hover .duelmark,.duelpick:focus-visible .duelmark{opacity:1; transform:translate(-50%,0)}
  .duelround{color:var(--accent); font-variant-numeric:tabular-nums}
  .motion-token{
    position:fixed; z-index:2000; margin:0; padding:0; object-fit:cover;
    border:2px solid #5bd197; border-radius:5px; box-shadow:0 8px 28px #000a,0 0 22px #5bd19766;
    pointer-events:none; transform-origin:top left; will-change:transform,opacity;
  }

  @media (prefers-reduced-motion:reduce){
    .duelpick img,.duelmark{transition:none!important}
  }

  .artisthero{
    flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center;
    padding:8px; background:var(--hole); border-radius:5px; overflow:hidden;
  }
  .artisthero img{width:100%; height:100%; object-fit:contain; border-radius:5px}
  .artistprompt{color:var(--dim); text-align:center; padding:16px}
  .artistlinks{display:flex; gap:5px; margin-left:auto}
  .artistlink{
    color:var(--dim); text-decoration:none; padding:2px 6px;
    border:1px solid var(--line); border-radius:4px; background:var(--panel2);
  }
  .artistlink:hover{color:var(--ink); border-color:var(--accent)}

  .chunkintro{
    flex:0 0 auto; display:flex; align-items:center; gap:6px; margin-bottom:7px;
    color:var(--dim); font-size:.82em;
  }
  .chunkintro b{color:var(--ink)}
  .chunkgrid{
    flex:1 1 auto; min-height:0; display:grid;
    grid-template-columns:repeat(3,minmax(74px,1fr)); gap:6px;
  }
  .chunkcard{
    min-width:0; min-height:0; position:relative; overflow:hidden;
    border:1px solid var(--line); border-radius:5px; background:var(--hole);
    color:var(--ink); cursor:default;
  }
  .chunkcard img{width:100%; height:100%; object-fit:cover; display:block}
  .chunkcard:nth-child(2) img,.chunkcard:nth-child(7) img{filter:hue-rotate(22deg) saturate(.82)}
  .chunkcard:nth-child(3) img,.chunkcard:nth-child(5) img{filter:hue-rotate(-28deg) contrast(1.05)}
  .chunkcard:nth-child(4) img,.chunkcard:nth-child(8) img{filter:saturate(.68) brightness(.9)}
  .chunkname{
    position:absolute; left:0; right:0; bottom:0; padding:14px 5px 4px;
    background:linear-gradient(transparent,#080a0ddd); font-size:.78em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .chunkmeta{display:block; color:#aab2c0; font-size:.82em}
  .chunkcard.create{
    display:grid; place-items:center; border-style:dashed; color:var(--dim);
    background:var(--panel2); text-align:center;
  }
  .chunkcard.create b{display:block; color:var(--ink); margin-top:4px}
  .chunkplus{font-size:2em; color:var(--accent); line-height:1}
  .chunktooltip{
    position:fixed; z-index:1000; display:none; min-width:210px; max-width:280px;
    padding:8px; border:1px solid #f0c44088; border-radius:var(--r);
    color:var(--ink); background:#11151deF; box-shadow:0 10px 28px #0008;
    pointer-events:none; backdrop-filter:blur(6px);
  }
  .chunktooltip.on{display:block}
  .chunktooltip-head{
    display:flex; align-items:center; gap:6px; padding:0 2px 6px;
    color:var(--dim); border-bottom:1px solid var(--line); font-size:.78em;
  }
  .chunktooltip-head b{color:var(--ink); font-size:1.08em}
  .chunktooltip-head span{margin-left:auto}
  .chunktooltip-list{display:flex; flex-direction:column; gap:3px; padding-top:6px}
  .chunktooltip-row{
    display:grid; grid-template-columns:24px minmax(0,1fr) 44px; align-items:center; gap:6px;
    min-height:25px; padding:3px 5px; border-radius:4px; background:var(--panel2);
  }
  .chunktooltip-order{color:var(--accent); font-size:.72em; font-variant-numeric:tabular-nums}
  .chunktooltip-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .chunktooltip-weight{color:var(--ink); text-align:right; font-family:ui-monospace,Consolas,monospace; font-size:.82em}
  .chunktooltip-weight.neg{color:#ff8f8f}

  .axishead{display:flex; align-items:center; gap:6px; width:100%}
  .axisglyph{color:var(--accent); font-size:1.15em}
  .axiscount{color:var(--dim); font-variant-numeric:tabular-nums}
  .axisbtn{
    width:24px; height:24px; display:grid; place-items:center; padding:0;
    color:var(--dim); background:transparent; border:1px solid transparent;
    border-radius:4px; cursor:pointer;
  }
  .axisbtn:hover{color:var(--ink); background:var(--panel2); border-color:var(--line)}
  .axisbtn:disabled{opacity:.25; cursor:default}

  .matchhistory{
    position:relative; display:flex; flex-direction:column; gap:5px;
    padding-left:12px; min-height:100%;
  }
  .matchhistory::before{
    content:""; position:absolute; left:4px; top:4px; bottom:4px;
    border-left:1px solid var(--line);
  }
  .hgroup{
    position:relative; display:flex; flex-direction:column; gap:4px; padding:5px;
    border:1px solid var(--line); border-radius:6px; background:color-mix(in srgb,var(--panel2) 48%,transparent);
  }
  .hgroup.current{border-color:#f0c44099; box-shadow:inset 0 0 0 1px #f0c44018}
  .hgroup-head{
    display:flex; align-items:center; gap:5px; min-height:20px; padding:0 2px;
    color:var(--dim); font-size:.72em; font-variant-numeric:tabular-nums;
  }
  .hgroup-head span{color:var(--ink); font-weight:700}
  .hgroup.current .hgroup-head span{color:var(--accent)}
  .hgroup-head b{margin-left:auto; color:var(--dim); font-weight:600}
  .hgroup-list{display:flex; flex-direction:column; gap:4px}
  .hmatch{
    position:relative; display:grid; grid-template-columns:1fr 14px 1fr;
    align-items:center; gap:3px; padding:4px; border-radius:5px; background:var(--panel2);
  }
  .hmatch::before{
    content:attr(data-step); position:absolute; left:-14px; top:50%; transform:translate(-50%,-50%);
    width:14px; height:14px; display:grid; place-items:center; border-radius:50%;
    color:var(--dim); background:var(--panel); border:1px solid var(--line); font-size:.58em;
  }
  .hmatch.current::before{color:#211903; background:var(--accent); border-color:var(--accent)}
  .hmatch.current{box-shadow:inset 0 0 0 1px #f0c44088}
  .hslot{
    position:relative; min-width:0; height:54px; padding:0; overflow:hidden;
    border:1px solid var(--line); border-radius:4px; background:var(--hole); cursor:pointer;
  }
  .hslot img{width:100%; height:100%; object-fit:cover; display:block; transition:filter .12s,opacity .12s}
  .hslot.win{border-color:#5bd197; box-shadow:inset 0 0 0 1px #5bd19755}
  .hslot.lose img{filter:grayscale(1)!important; opacity:.24}
  .hslot.lose{border-color:#303641}
  .hslot.live:hover{border-color:var(--accent)}
  .hvs{color:var(--dim); text-align:center; font-size:.72em}

  #tournamentBracket{
    flex:1 1 auto; min-height:0; flex-direction:column; padding:7px 10px 7px;
  }
  .brackettools{
    position:relative; flex:0 0 32px; display:flex; align-items:center; gap:5px;
    color:var(--dim); font-size:.75em;
  }
  .bracketstatus{
    position:absolute; left:50%; transform:translateX(-50%);
    color:var(--ink); font-size:1.08em; font-weight:700; font-variant-numeric:tabular-nums;
  }
  .bracketstatus b{color:var(--accent)}
  .bracketcanvas{
    flex:1 1 auto; min-height:0; display:grid;
    grid-template-columns:repeat(5,minmax(92px,1fr)); gap:22px; padding:2px 9px 4px;
    overflow:auto;
  }
  .bround{min-width:0; min-height:360px; display:flex; flex-direction:column}
  .broundhead{
    flex:0 0 24px; display:flex; align-items:center; justify-content:center; gap:5px;
    color:var(--dim); font-size:.78em; font-variant-numeric:tabular-nums;
  }
  .broundhead b{color:var(--dim); font-weight:600}
  .bround.active .broundhead{color:var(--accent); font-weight:700}
  .bround.active .broundhead b{color:var(--ink)}
  .bcolumn{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; justify-content:space-around; gap:3px}
  .bmatch{
    position:relative; display:grid; grid-template-columns:1fr 1fr; gap:3px;
  }
  .bmatch.current{margin:-3px; padding:3px; border-radius:5px; background:#f0c4400b; box-shadow:0 0 0 2px #f0c440bb}
  .bround:not(:last-child) .bmatch::after{
    content:""; position:absolute; left:100%; top:50%; width:23px; border-top:1px solid var(--line);
  }
  .bmatch.decided:hover::before{
    content:"↶"; position:absolute; z-index:3; left:50%; top:50%; transform:translate(-50%,-50%);
    width:19px; height:19px; display:grid; place-items:center; border-radius:50%;
    color:var(--accent); background:#0d1016dd; pointer-events:none;
  }
  .bslot{
    position:relative; min-width:0; height:38px; padding:0; overflow:hidden;
    border:1px solid var(--line); border-radius:4px; background:var(--hole); cursor:pointer;
  }
  .bslot img{width:100%; height:100%; object-fit:cover; display:block; transition:filter .12s,opacity .12s}
  .bslot.win{border-color:#5bd197; box-shadow:inset 0 0 0 1px #5bd19755}
  .bslot.lose img{filter:grayscale(1)!important; opacity:.38}
  .bslot.lose{border-color:#303641}
  .bslot.live:hover{border-color:var(--accent); transform:translateY(-1px)}
  .bslot.empty{cursor:default; border-style:dashed; opacity:.32}
  .bchamp{
    width:min(100%,72px); aspect-ratio:1; align-self:center; padding:0; overflow:hidden;
    border:1px dashed var(--line); border-radius:50%; background:var(--hole);
  }
  .bchamp img{width:100%; height:100%; object-fit:cover}
  .bchamp.done{border:2px solid var(--accent); box-shadow:0 0 20px #f0c44022}
  .roundscale{
    flex:0 0 30px; position:relative; display:grid; grid-template-columns:repeat(5,1fr);
    align-items:center; margin:0 9px; color:var(--dim); font-size:.7em; text-align:center;
  }
  .roundscale::before{
    content:""; position:absolute; left:10%; right:10%; top:50%; height:2px;
    transform:translateY(-50%); background:var(--line);
  }
  .roundscale::after{
    content:""; position:absolute; left:10%; top:50%; width:var(--round-progress,0%); height:2px;
    transform:translateY(-50%); background:#5bd197; transition:width .18s ease;
  }
  .rmark{position:relative; z-index:1; display:grid; place-items:center; gap:1px}
  .rmark i{width:8px; height:8px; border-radius:50%; background:var(--line); box-shadow:0 0 0 3px var(--panel)}
  .rmark.done i{background:#5bd197}
  .rmark.on{color:var(--ink)}
  .rmark.on i{width:11px; height:11px; background:var(--accent)}

  @media (max-width:900px){
    .stage{flex-direction:column}
    .mains{flex-direction:column}
    #sideL,#sideR{flex:0 0 auto; height:200px}
    #mainL,#mainR{flex:1 1 auto; min-height:220px}
    .split{display:none}
    .floor{margin-top:var(--gap)}   /* 손잡이가 사라지므로 간격을 직접 준다 */
    .chunkgrid{grid-template-columns:repeat(2,minmax(90px,1fr))}
    .bracketcanvas{grid-template-columns:repeat(5,118px); overflow-x:auto}
  }
</style>
</head>
<body>

<!--
FEATURE app-shell
  PURPOSE      preserve the NovelAI-like working context while an experiment changes inner panels
  STATE        panel sizes, collapsed panels, theme, font size, floor height
  EVENT        resize handles and toolbar buttons update layout without losing prompt or experiment state
  TODO         persist user preferences in the application settings store instead of localStorage
  ACCEPTANCE   reopening restores presentation preferences but never resurrects a discarded tournament
-->
<div class="top">
  <button class="ico" id="tL" title="왼쪽 접기">▤</button>
  <span class="brand">Tag Lab</span>
  <span class="chip">Anlas <b>9335</b></span>
  <span class="tournament-status" id="tournamentStatus" aria-live="polite"></span>
  <span class="spacer"></span>
  <button class="ico top-mid">✦</button><button class="ico top-mid">⊞ 32</button><button class="ico top-mid">◲ 1</button>
  <span class="spacer"></span>
  <button class="ico" id="fsD">A−</button>
  <button class="ico" id="fsU">A+</button>
  <button class="ico" id="th">◐</button>
  <button class="ico" id="tF" title="바닥 그래프 접기">▭</button>
  <button class="ico" id="tR" title="히스토리 접기">▦</button>
</div>

<div class="stage">

  <!--
  FEATURE prompt-and-artist-source
    PURPOSE      edit the NovelAI prompt and expose its artist tokens as manipulable views
    INPUT        PromptState.rawText using `artist:name` or `weight::artist:name::`
    EVENT        text edit reparses; weight edit, add, remove, or drag rewrites rawText immediately
    OUTPUT       numbered artist rows, stable colors, weights, and graph bars
    INVARIANT    rows and bars are projections of rawText; never maintain a second artist array as truth
    INVARIANT    drag order writes prompt order; popularity/training/weight sorting never does
    TODO         replace the small MOCK Danbooru metric map with the shipped offline catalog
    ACCEPTANCE   reloading parsed text reproduces exactly the same artist order and weights
  -->
  <div class="col" id="sideL">
    <div class="panel" style="flex:1 1 auto">
      <div class="phead">
        <select class="sel"><option>V4.5 Full</option></select>
        <select class="sel"><option>Anime</option></select>
      </div>
      <div class="pbody" style="display:flex;flex-direction:column;gap:0;padding-bottom:4px">
        <div class="tabs">
          <button class="tab on" data-t="t1">Prompt</button>
          <button class="tab" data-t="t2">Undesired</button>
        </div>

        <div class="tabbody on" id="t1">
          <div class="ptwrap" id="ptwrap" style="height:150px">
            <div class="ptmirror" id="mirror" aria-hidden="true"></div>
            <textarea class="pt" id="pt" spellcheck="false">1girl, solo, portrait,

artist:lack, 0.5::artist:riich::, 0.5::artist:sousouman::, artist:wlop,
artist:wanke, artist:ciloranko, 0.8::artist:happoubi jin::, artist:michiking,
0.9::artist:toosaka asagi::, artist:modare, artist:freng, 0.4::artist:quasarcake::,
0.5::artist:fuzichoco::, artist:sho (sho lwlw), artist:mignon, artist:asanagi,
-0.4::artist:parsley-f::,

solo artist, year 2025, shallow depth of field, best quality</textarea>
          </div>
          <div class="split v" id="spT" style="flex:0 0 8px;margin:0"></div>

          <div class="combobar">
            <span><b id="wcnt" style="color:var(--ink)">0</b>개 · 합 <b id="wsum" style="color:var(--ink)">0</b></span>
            <span class="spacer"></span>
            <button class="mini on" id="onlyA">작가만</button>
            <button class="mini" id="resetW">전부 1.0</button>
          </div>
          <div class="combobar" style="padding:0 3px 4px">
            <select class="pick" id="sortKey">
              <option value="prompt">프롬프트</option>
              <option value="weight">가중치순</option>
              <option value="pop">작가 인기순</option>
              <option value="train">작가 학습량순</option>
            </select>
            <select class="pick" id="sortDir" style="flex:0 0 84px">
              <option value="asc">오름차순</option>
              <option value="desc">내림차순</option>
            </select>
          </div>
          <div class="artistadd">
            <input id="addArtist" placeholder="작가 태그 추가" autocomplete="off">
            <button class="mini" id="addArtistBtn">＋</button>
          </div>
          <div id="combo"></div>
        </div>

        <div class="tabbody" id="t2" style="padding-top:6px"><div class="hole">Undesired Content</div></div>
      </div>
      <div class="pfoot">
        <div class="row" style="color:var(--dim);font-size:.85em">
          <span>Steps <b style="color:var(--ink)">28</b></span>
          <span>Guidance <b style="color:var(--ink)">8</b></span>
          <span>Sampler <b style="color:var(--ink)">Euler A</b></span>
        </div>
      </div>
    </div>
    <div class="panel" style="flex:0 0 auto">
      <div class="pfoot" style="border-top:none"><button class="genbtn">Generate 1 Image</button></div>
    </div>
  </div>

  <div class="split" id="spL"></div>

  <!-- 가운데 기둥 : 메인 두 칸 + 그 아래 바닥 그래프 -->
  <div id="center">
  <div class="mains">

  <!--
  FEATURE generation-canvas-and-left-candidate
    PURPOSE      editing state shows the generated NovelAI image; tournament state shows candidate A
    EVENT        in editing, generation settings create one image; in tournament, clicking A selects it
    TODO         connect generation to the NovelAI adapter and store prompt, seed, model, and settings
    TODO         candidate images must be generated from the frozen tournament probe, not reused MOCK assets
    ACCEPTANCE   entering and leaving tournament mode restores the generation canvas without losing its image
  -->
  <div class="col" id="mainL">
    <div class="main-left-normal">
      <div class="panel" style="flex:1 1 auto">
        <div class="phead">이미지 제작<span class="spacer"></span><span>832 × 1216</span></div>
        <div class="canvas"><div class="hole">NAI로 만들어진 이미지</div></div>
        <div class="pfoot row">
          <button class="barbtn">⚙</button>
          <button class="barbtn">seed 4257072022</button>
          <span class="spacer"></span>
          <button class="barbtn">📌</button><button class="barbtn">⧉</button><button class="barbtn">💾</button>
        </div>
      </div>
    </div>
    <div class="panel duel-left">
      <div class="phead"><span>◐ A</span><span class="spacer"></span><span class="duelround" id="duelRoundLeft">16</span></div>
      <button class="duelpick" id="duelLeftPick" aria-label="왼쪽 후보 선택">
        <img id="duelLeftImage" alt="">
        <span class="duelmark" aria-hidden="true">✓</span>
      </button>
    </div>
  </div>

  <div class="split" id="spM"></div>

  <!--
  FEATURE seed-context-and-right-candidate
    PURPOSE      before an experiment, inspect the explicitly selected seed artist; during it, show candidate B
    STATE        selectedSeed is null until the user clicks an artist row, graph bar, or graph label
    EVENT        seed selection updates title, representative image, links, chunk chooser, and tournament context
    INVARIANT    no default seed. MOCK tag `lack` inside the prompt is ordinary prompt content, not application state
    TODO         resolve representative image and verified external links from the artist catalog
    ACCEPTANCE   selecting `mignon` makes every seed label read `mignon`; changing seed mid-match clears the tournament
  -->
  <div class="col" id="mainR">
    <div class="panel" id="rA" style="flex:1 1 auto">
      <div class="artist-normal">
        <div class="phead">
          작가 그림 · <span id="whoA">—</span>
          <span class="artistlinks">
            <a class="artistlink" id="danbooruLink" href="#">Danbooru ↗</a>
            <a class="artistlink" id="twitterLink" href="#">X / Twitter ↗</a>
          </span>
        </div>
        <div class="pbody" style="display:flex;flex-direction:column">
          <div class="artisthero">
            <div class="artistprompt" id="artistPrompt">왼쪽 작가명이나 그래프 막대를 눌러 시드 선택</div>
            <img id="artistHero" alt="" hidden>
          </div>
        </div>
        <div class="pfoot"><button class="genbtn" id="chunkStart">작가 청크 실험하기</button></div>
      </div>

      <!--
      FEATURE chunk-selection
        PURPOSE      choose a reusable verified chunk or create a new tournament for the selected seed
        INPUT        Chunk records with ordered artists and weights
        EVENT        hover/focus reveals order, artist name, and weight from the same Chunk.artists array
        EVENT        clicking an existing or new chunk resets prior matches and enters tournament-running
        INVARIANT    the floor remains the weight graph while browsing chunks; it changes only after a chunk starts
        MOCK         eight cards, images, statuses, and chunkLibrary compositions are demonstration records
        TODO         load personal library, favorites, notes, and prior experiment status from persistence
        ACCEPTANCE   card member count always equals tooltip row count; no previous bracket survives entry
      -->
      <div class="chunk-entry">
        <div class="phead">
          작가 청크 고르기 · 시드 <b id="chunkSeed" style="color:var(--ink)">—</b>
          <span class="spacer"></span>
          <button class="mini" id="chunkBack">← 작가 그림</button>
        </div>
        <div class="pbody" style="display:flex;flex-direction:column">
          <div class="chunkintro"><b>이전 청크</b><span>대표 이미지를 보고 고르거나 새 청크를 만든다.</span></div>
          <div class="chunkgrid">
            <button class="chunkcard" data-chunk="cold-fantasy"><img src="../resource/original.png" alt="차가운 판타지 청크"><span class="chunkname">차가운 판타지<span class="chunkmeta">3명 · 검증 완료</span></span></button>
            <button class="chunkcard" data-chunk="glass-portrait"><img src="../resource/test.png" alt="유리빛 인물화 청크"><span class="chunkname">유리빛 인물화<span class="chunkmeta">2명 · 검증 완료</span></span></button>
            <button class="chunkcard" data-chunk="vivid-contrast"><img src="../resource/original.png" alt="선명한 명암 청크"><span class="chunkname">선명한 명암<span class="chunkmeta">4명 · 8강 진출</span></span></button>
            <button class="chunkcard" data-chunk="soft-color"><img src="../resource/test.png" alt="부드러운 채색 청크"><span class="chunkname">부드러운 채색<span class="chunkmeta">3명 · 검증 완료</span></span></button>
            <button class="chunkcard" data-chunk="gray-outfit"><img src="../resource/original.png" alt="무채색 의상 청크"><span class="chunkname">무채색 의상<span class="chunkmeta">2명 · 탈락 기록</span></span></button>
            <button class="chunkcard" data-chunk="strong-line"><img src="../resource/test.png" alt="강한 선화 청크"><span class="chunkname">강한 선화<span class="chunkmeta">3명 · 검증 완료</span></span></button>
            <button class="chunkcard" data-chunk="dream-bg"><img src="../resource/original.png" alt="몽환 배경 청크"><span class="chunkname">몽환 배경<span class="chunkmeta">2명 · 검증 완료</span></span></button>
            <button class="chunkcard" data-chunk="calm-color"><img src="../resource/test.png" alt="차분한 색감 청크"><span class="chunkname">차분한 색감<span class="chunkmeta">3명 · 준결승</span></span></button>
            <button class="chunkcard create" id="newChunkButton"><span><span class="chunkplus">＋</span><b>새 청크 만들기</b></span></button>
          </div>
        </div>
      </div>

      <div class="duel-right">
        <div class="phead"><span>◐ B</span><span class="spacer"></span><span class="duelround" id="duelRoundRight">16</span><button class="axisbtn" id="duelExit" aria-label="청크 선택으로 돌아가기">×</button></div>
        <button class="duelpick" id="duelRightPick" aria-label="오른쪽 후보 선택">
          <img id="duelRightImage" alt="">
          <span class="duelmark" aria-hidden="true">✓</span>
        </button>
      </div>
    </div>
  </div>

  </div><!-- /.mains -->

  <div class="split v" id="spF" style="flex:0 0 var(--gap)"></div>

  <!--
  FEATURE floor-projection
    PURPOSE      use the same resizable floor for weight editing or tournament structure
    STATE        editing and chunk-selection show bars; tournament-running shows bracket
    EVENT        vertical bar drag edits weight, horizontal drag edits prompt order, bracket click rolls back a branch
    INVARIANT    graph and prompt share artist identity, order, weight, hover highlight, add, and remove behavior
    INVARIANT    bracket rollback deletes every downstream decision dependent on the changed match
    TODO         replace MOCK candidate images while retaining Match identity across rerenders

<script>
/*
IMPLEMENTATION MAP
  Presentation preferences: KEY, load, save, resize handlers
  Prompt domain: tokenize -> rebuild -> render -> paint -> syncText
  Seed domain: selectSeed -> paintSeedSelection -> renderSeedContext
  Chunk domain: chunkLibrary -> tooltip handlers -> startTournament
  Tournament domain: tournamentWinners and tournamentOrder -> renderTournament
  Tournament projections: renderDuel, renderBracket, renderHistory, renderRoundScale
  Decision mutation: chooseTournament and clearTournamentAfter
  Feedback: animateTournamentChoice and animateDuelArrival

PRODUCTION REPLACEMENT RULE
  Replace MOCK storage and data sources behind these boundaries. Do not rewrite the visible
  event sequence unless the corresponding FEATURE and ACCEPTANCE comments are updated first.
*/
// ── 만진 것은 전부 기억한다. 브라우저가 저장을 막아도 화면은 정상이어야 한다 ──
const KEY="shell-v12";
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch{return{}}};
const save=p=>{try{localStorage.setItem(KEY,JSON.stringify({...load(),...p}))}catch{}};
const S=load(), root=document.documentElement;

let fs=S.fs||13;
const applyFs=()=>{root.style.setProperty("--fs",fs+"px");save({fs})};
applyFs();
fsU.onclick=()=>{fs=Math.min(fs+1,20);applyFs()};
fsD.onclick=()=>{fs=Math.max(fs-1,11);applyFs()};

if(S.theme)root.setAttribute("data-theme",S.theme);
th.onclick=()=>{const n=root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.setAttribute("data-theme",n);save({theme:n})};

if(S.noL)document.body.classList.add("noL");
if(S.noR)document.body.classList.add("noR");
tL.onclick=()=>{document.body.classList.toggle("noL");save({noL:document.body.classList.contains("noL")})};
tR.onclick=()=>{document.body.classList.toggle("noR");save({noR:document.body.classList.contains("noR")})};

const floor=document.getElementById("floor");
if(S.noF)document.body.classList.add("noF");
if(S.floorH)floor.style.height=S.floorH+"px";
tF.onclick=()=>{document.body.classList.toggle("noF");save({noF:document.body.classList.contains("noF")})};
document.getElementById("spF").addEventListener("pointerdown",e=>{
  const h=e.currentTarget; h.setPointerCapture(e.pointerId);
  const y0=e.clientY, h0=floor.getBoundingClientRect().height;
  const move=ev=>{floor.style.height=Math.min(1000,Math.max(70,h0-(ev.clientY-y0)))+"px"};
  const up=()=>{h.removeEventListener("pointermove",move);h.removeEventListener("pointerup",up);
    save({floorH:Math.round(floor.getBoundingClientRect().height)})};
  h.addEventListener("pointermove",move); h.addEventListener("pointerup",up);
});

// 탭
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".tabbody").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); document.getElementById(b.dataset.t).classList.add("on");
});

// 가로/세로 손잡이
function drag(handle,target,key,axis,dir,min,max){
  handle.addEventListener("pointerdown",e=>{
    handle.setPointerCapture(e.pointerId);
    const p0=axis==="x"?e.clientX:e.clientY;
    const r=target.getBoundingClientRect(), s0=axis==="x"?r.width:r.height;
    const move=ev=>{
      const p=axis==="x"?ev.clientX:ev.clientY;
      target.style.flex="0 0 "+Math.min(max,Math.max(min,s0+(p-p0)*dir))+"px";
    };
    const up=()=>{handle.removeEventListener("pointermove",move);
      handle.removeEventListener("pointerup",up);
      const rr=target.getBoundingClientRect();
      save({[key]:Math.round(axis==="x"?rr.width:rr.height)})};
    handle.addEventListener("pointermove",move);
    handle.addEventListener("pointerup",up);
  });
}
const sideL=document.getElementById("sideL"), sideR=document.getElementById("sideR"),
      mainL=document.getElementById("mainL"),
      pt=document.getElementById("pt"), mirror=document.getElementById("mirror"),
      ptwrap=document.getElementById("ptwrap");
if(S.sideL)sideL.style.flex="0 0 "+S.sideL+"px";
if(S.sideR)sideR.style.flex="0 0 "+S.sideR+"px";
if(S.mainL)mainL.style.flex="0 0 "+S.mainL+"px";
if(S.ptH)  ptwrap.style.height=S.ptH+"px";
drag(spL,sideL,"sideL","x",+1,200,560);
drag(spM,mainL,"mainL","x",+1,240,1400);
drag(spR,sideR,"sideR","x",-1,90,420);
document.getElementById("spT").addEventListener("pointerdown",e=>{
  const h=e.currentTarget; h.setPointerCapture(e.pointerId);
  const y0=e.clientY, h0=ptwrap.getBoundingClientRect().height;
  const move=ev=>{ptwrap.style.height=Math.min(600,Math.max(52,h0+(ev.clientY-y0)))+"px"};
  const up=()=>{h.removeEventListener("pointermove",move);h.removeEventListener("pointerup",up);
    save({ptH:Math.round(ptwrap.getBoundingClientRect().height)})};
  h.addEventListener("pointermove",move); h.addEventListener("pointerup",up);
});

/* ══════════════════════════════════════════════════════════════
   프롬프트 글자가 유일한 원본이다.
   색칠한 사본, 목록, 막대는 전부 그 글자를 읽어서 그린 것이고
   어느 쪽을 만지든 곧바로 그 글자가 다시 쓰인다.
   ══════════════════════════════════════════════════════════════ */

// 색은 이름에 붙어 다닌다. 정렬하든 지웠다 다시 넣든 그 태그의 색은 안 바뀐다
const hues=new Map(); let hueN=0;
function hueOf(name){
  if(!hues.has(name)) hues.set(name, Math.round((hueN++*137.508)%360));
  return hues.get(name);
}
const colorOf=name=>`hsl(${hueOf(name)} 62% 62%)`;

const fmt=v=>String(Math.round(v*100)/100);
const isArtist=n=>/^artist:/i.test(n);
const shortName=n=>n.replace(/^artist:/i,"");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

// 프롬프트 글자 → 토큰. 여백과 줄바꿈은 손대지 않고 그대로 들고 있는다
function parseCore(core){
  const m=/^(-?\d+(?:\.\d+)?)\s*::\s*([\s\S]+?)\s*::$/.exec(core);
  return m ? {w:parseFloat(m[1]), name:m[2]} : {w:1, name:core};
}
function tokenize(text){
  const out=[]; let start=0;
  for(let i=0;i<=text.length;i++){
    if(i<text.length && text[i]!==",") continue;
    const body=text.slice(start,i);
    let sep="";
    if(i<text.length){
      let j=i+1; while(j<text.length && /\s/.test(text[j])) j++;
      sep=text.slice(i,j); i=j-1; start=j;
    }
    const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(body);
    out.push({pre:m[1], post:m[3], sep, ...parseCore(m[2])});
    if(!sep) break;
  }
  return out;
}
const tokenText=t=>t.w===1 ? t.name : `${fmt(t.w)}::${t.name}::`;

function syncText(refreshMirror=true){
  const s=pt.selectionStart;
  pt.value=toks.map(t=>t.pre+tokenText(t)+t.post+t.sep).join("");
  try{pt.selectionStart=pt.selectionEnd=Math.min(s,pt.value.length)}catch{}
  if(refreshMirror)paintMirror();
}
// 아래층 사본을 다시 칠한다. 글자 하나하나가 그 작가의 색을 갖는다
function paintMirror(){
  const slot=new Map(); ai.forEach((ti,k)=>slot.set(ti,k));
  const order=new Map(); let no=0;
  toks.forEach((t,i)=>{if(isArtist(t.name))order.set(i,++no)});
  let html="";
  toks.forEach((t,i)=>{
    const k=slot.get(i), body=esc(tokenText(t));
    html+=esc(t.pre)
       + (k===undefined ? body
          : `<span class="tk" data-k="${k}" style="color:${colorOf(t.name)}">`+
            `<span class="ord">${order.get(i)??""}</span>${body}</span>`)
       + esc(t.post) + esc(t.sep);
  });
  mirror.innerHTML=html+"\n";
  mirror.scrollTop=pt.scrollTop;
}
pt.addEventListener("scroll",()=>{mirror.scrollTop=pt.scrollTop});

/* ── 세로 축 ──
   -10~10 은 NAI가 허용하는 한계일 뿐 늘 그만큼 그릴 이유는 없다.
   지금 들어 있는 값에 맞춰 축을 좁히되, 0 과 1.0 은 기준선이라 항상 품는다.
   끌어올리는 중에는 축을 줄이지 않는다(줄었다 늘었다 하면 손이 흔들린다). */
const HARD=10;
let LO=-0.5, HI=1.5;
const upTo=v=>Math.ceil(v*2)/2, downTo=v=>Math.floor(v*2)/2;   // 0.5 눈금 바깥으로
function fitAxis(growOnly){
  let mx=1, mn=0;                       // 1.0 과 0 은 무조건 보인다
  ai.forEach(i=>{const w=toks[i].w; if(w>mx)mx=w; if(w<mn)mn=w});
  const pad=Math.max((mx-mn)*0.12, 0.25);
  let hi=Math.min(HARD, upTo(mx+pad)), lo=Math.max(-HARD, downTo(mn-pad));
  if(growOnly){ hi=Math.max(hi,HI); lo=Math.min(lo,LO); }
  HI=hi; LO=lo;
}
const pctOf=v=>(v-LO)/(HI-LO)*100;

let toks=[], ai=[], onlyArtist=S.onlyArtist!==false, selectedSeed=S.seedArtist||null;
const combo=document.getElementById("combo"),
      bars=document.getElementById("bars"), ticks=document.getElementById("ticks"),
      names=document.getElementById("names"),
      sortKey=document.getElementById("sortKey"), sortDir=document.getElementById("sortDir");
sortKey.value=S.sortKey||"prompt";
sortDir.value=S.sortDir||"asc";

/*
MOCK artist-metrics adapter
   Danbooru에서 실제로 긁어온 값 (2026-08-23 기준).
   인기  = 그 작가 그림들의 Score 평균. 전량이 아니라 order:random 표본의 평균이다.
   학습량 = 그 작가 태그의 post_count.
   riich 는 태그 자체가 없고 sho (sho lwlw) 는 0장이라 값이 없다.
TODO production adapter returns `{ pop, train }` from the offline catalog by normalized artist tag.
*/
const DAN={
  "mignon":       {pop:232.0, train:963},
  "freng":        {pop:123.4, train:670},
  "asanagi":      {pop:106.2, train:1628},
  "michiking":    {pop: 97.4, train:280},
  "modare":       {pop: 64.4, train:1070},
  "happoubi jin": {pop: 62.1, train:1458},
  "quasarcake":   {pop: 40.4, train:375},
  "lack":         {pop: 37.4, train:1341},
  "ciloranko":    {pop: 34.1, train:252},
  "sousouman":    {pop: 33.2, train:1160},
  "wanke":        {pop: 32.0, train:178},
  "toosaka asagi":{pop: 22.7, train:2061},
  "wlop":         {pop: 22.4, train:400},
  "fuzichoco":    {pop: 19.9, train:1161},
  "parsley-f":    {pop: 16.0, train:892},
  "sho (sho lwlw)":{pop:null, train:0},
};
const danOf=(n,f)=>{const d=DAN[shortName(n)]; return d?d[f]:null};
// 정렬 기준. prompt 는 프롬프트에 적힌 자리 그대로
const sortVal={
  prompt:i=>i,
  weight:i=>toks[i].w,
  pop:   i=>danOf(toks[i].name,"pop"),
  train: i=>danOf(toks[i].name,"train"),
};
// 수치를 모르는 태그는 오름/내림과 무관하게 늘 맨 끝으로 보낸다
function cmp(a,b,d){
  const A=a[1],B=b[1], an=A==null||Number.isNaN(A), bn=B==null||Number.isNaN(B);
  if(an&&bn) return a[0]-b[0];
  if(an) return 1;
  if(bn) return -1;
  return (A-B)*d || a[0]-b[0];
}

function rebuild(){
  toks=tokenize(pt.value);
  ai=toks.map((t,i)=>i).filter(i=>toks[i].name && (!onlyArtist || isArtist(toks[i].name)));
  const artists=toks.filter(t=>isArtist(t.name));
  if(selectedSeed&&!artists.some(t=>t.name.toLowerCase()===selectedSeed.toLowerCase())){
    selectedSeed=null;
    save({seedArtist:selectedSeed});
  }
  // 정렬은 보기 순서일 뿐, 프롬프트 글자는 건드리지 않는다.
  // 그래야 "프롬프트" 순으로 언제든 되돌아올 수 있다
  const f=sortVal[sortKey.value]||sortVal.prompt, d=sortDir.value==="desc"?-1:1;
  ai=ai.map(i=>[i,f(i)]).sort((a,b)=>cmp(a,b,d)).map(x=>x[0]);
  fitAxis(false);
  render();
}
function render(){
  combo.innerHTML=""; names.innerHTML="";
  [...bars.querySelectorAll(".bar")].forEach(b=>b.remove());
  const order=new Map(); let no=0;
  toks.forEach((t,i)=>{if(isArtist(t.name))order.set(i,++no)});
  ai.forEach((ti,k)=>{
    const t=toks[ti], c=colorOf(t.name);

    const row=document.createElement("div");
    row.className="arow"+(isArtist(t.name)?"":" plain");
    row.dataset.k=k; row.style.setProperty("--c",c);
    row.title=isArtist(t.name)?"위아래로 끌어서 프롬프트 순서 변경":"";
    const sk=sortKey.value, showMeta=(sk==="pop"||sk==="train");
    const mv=showMeta?danOf(t.name,sk):undefined;
    row.innerHTML=`<span class="dot"></span>`+
      `<span class="idx">${order.has(ti)?String(order.get(ti)).padStart(2,"0"):"—"}</span>`+
      `<span class="nm" title="${t.name}">${shortName(t.name)}</span>`+
      (showMeta?`<span class="meta" title="${sk==="pop"?"Score 평균":"Danbooru 장수"}">`+
        (mv==null?"—":mv)+`</span>`:"")+
      `<input class="w" value="${t.w.toFixed(2)}">`+
      `<button class="x">×</button>`;
    combo.appendChild(row);

    const b=document.createElement("div");
    b.className="bar"; b.dataset.k=k; b.title=t.name+" · 가로: 순서 / 세로: 가중치";
    b.style.setProperty("--c",c);
    b.innerHTML=`<span class="val"></span><span class="stem"></span>`;
    bars.appendChild(b);

    const n=document.createElement("span");
    n.textContent=shortName(t.name); n.title=t.name; n.dataset.k=k;
    n.style.setProperty("--c",c);
    names.appendChild(n);
  });
  paintMirror();
  paint();
  paintSeedSelection();
  renderSeedContext();
}
function paint(){
  const ZERO=pctOf(0), ONE=pctOf(1);
  // 최고·최저를 찾아둔다. 다만 1.0 은 "가중치를 안 준 값"이라 굵게 하지 않는다
  let mx=-Infinity, mn=Infinity;
  ai.forEach(i=>{const w=toks[i].w; if(w>mx)mx=w; if(w<mn)mn=w});
  [...combo.children].forEach(row=>{
    const t=toks[ai[row.dataset.k]], inp=row.querySelector(".w");
    if(document.activeElement!==inp) inp.value=t.w.toFixed(2);
    row.classList.toggle("neg", t.w<0);
    row.classList.toggle("top", mx!==1 && t.w===mx);
    row.classList.toggle("bot", mn!==1 && t.w===mn);
  });
  [...bars.querySelectorAll(".bar")].forEach(b=>{
    const v=toks[ai[b.dataset.k]].w, p=pctOf(v), neg=v<0;
    const stem=b.querySelector(".stem"), val=b.querySelector(".val");
    b.classList.toggle("neg",neg); b.classList.toggle("pos",!neg);
    stem.style.top="auto";
    if(neg){ stem.style.bottom=p+"%";    stem.style.height=(ZERO-p)+"%";
             val.style.bottom="calc("+p+"% - 14px)"; }
    else   { stem.style.bottom=ZERO+"%"; stem.style.height=(p-ZERO)+"%";
             val.style.bottom="calc("+p+"% + 2px)"; }
    val.textContent=fmt(v);
  });
  paintTicks();
  document.getElementById("wsum").textContent=ai.reduce((s,i)=>s+toks[i].w,0).toFixed(1);
  document.getElementById("wcnt").textContent=ai.length;
  const artistWeights=ai.filter(i=>isArtist(toks[i].name)).map(i=>toks[i].w);
  document.getElementById("infoCount").textContent=artistWeights.length;
  document.getElementById("infoMax").textContent=artistWeights.length?fmt(Math.max(...artistWeights)):"—";
  document.getElementById("infoMin").textContent=artistWeights.length?fmt(Math.min(...artistWeights)):"—";
}

function paintTicks(){
  ticks.innerHTML="";
  for(let v=Math.ceil(LO*2)/2;v<=HI+.001;v+=.5){
    const line=document.createElement("div"), label=document.createElement("span");
    const p=pctOf(v);
    line.className="tickline"+(v===0||v===1?" major":"");
    line.style.bottom=p+"%";
    label.className="ticklabel";
    label.style.bottom=p+"%";
    label.textContent=v===0?"0":v.toFixed(1);
    ticks.append(line,label);
  }
}

// 프롬프트 글자 ↔ 목록 ↔ 막대 ↔ 이름표. 넷이 같이 밝아진다
function hi(k,on){
  [combo.querySelector(`.arow[data-k="${k}"]`),
   bars.querySelector(`.bar[data-k="${k}"]`),
   names.querySelector(`span[data-k="${k}"]`),
   mirror.querySelector(`.tk[data-k="${k}"]`)]
   .forEach(el=>el&&el.classList.toggle("hi",on));
}
[combo,bars,names].forEach(host=>{
  host.addEventListener("pointerover",e=>{const el=e.target.closest("[data-k]"); if(el)hi(el.dataset.k,true)});
  host.addEventListener("pointerout" ,e=>{const el=e.target.closest("[data-k]"); if(el)hi(el.dataset.k,false)});
});

const artistpeek=document.getElementById("artistpeek"), peekimg=document.getElementById("peekimg"),
      peekname=document.getElementById("peekname");
const peekSources=["../resource/original.png","../resource/test.png"];
function seedTone(name){
  let value=0;
  for(const ch of name||"")value=(value*31+ch.charCodeAt(0))%360;
  return value;
}
function renderSeedContext(){
  const label=selectedSeed?shortName(selectedSeed):"—";
  document.getElementById("whoA").textContent=label;
  document.getElementById("chunkSeed").textContent=label;
  const hero=document.getElementById("artistHero");
  const prompt=document.getElementById("artistPrompt");
  const start=document.getElementById("chunkStart");
  start.disabled=!selectedSeed;
  hero.hidden=!selectedSeed;
  prompt.hidden=!!selectedSeed;
  if(!selectedSeed){
    hero.removeAttribute("src");
    hero.alt="";
    hero.style.filter="";
    return;
  }
  const tone=seedTone(selectedSeed);
  hero.src=peekSources[tone%peekSources.length];
  hero.alt=label+"의 단독 NAI 대표 이미지";

function clearDropMarks(){
  document.querySelectorAll(".drop-before,.drop-after,.dragging").forEach(el=>
    el.classList.remove("drop-before","drop-after","dragging"));
}

function reorderArtist(fromK,toK,after){
  if(fromK===toK)return;
  const fromTi=ai[fromK], toTi=ai[toK];
  if(fromTi==null||toTi==null||!isArtist(toks[fromTi].name)||!isArtist(toks[toTi].name))return;
  const shown=ai.filter(ti=>isArtist(toks[ti].name));
  const from=shown.indexOf(fromTi), to=shown.indexOf(toTi);
  if(from<0||to<0)return;
  const values=shown.map(ti=>({name:toks[ti].name,w:toks[ti].w}));
  const [moving]=values.splice(from,1);
  let at=to+(after?1:0)-(from<to?1:0);
  values.splice(Math.max(0,Math.min(values.length,at)),0,moving);
  const slots=toks.map((t,i)=>isArtist(t.name)?i:-1).filter(i=>i>=0);
  slots.forEach((ti,i)=>Object.assign(toks[ti],values[i]));
  sortKey.value="prompt"; sortDir.value="asc";
  save({sortKey:"prompt",sortDir:"asc"});
  syncText(); rebuild();
}

// 목록에서는 위아래로 끌어서 순서를 바꾼다
combo.addEventListener("pointerdown",e=>{
  if(e.target.closest("input,button"))return;
  const row=e.target.closest(".arow");
  if(!row||!isArtist(toks[ai[row.dataset.k]].name))return;
  row.setPointerCapture(e.pointerId);
  const y0=e.clientY; let active=false, target=null, after=false;
  const move=ev=>{
    if(!active&&Math.abs(ev.clientY-y0)<4)return;
    active=true; row.classList.add("dragging");
    document.querySelectorAll(".arow.drop-before,.arow.drop-after").forEach(el=>
      el.classList.remove("drop-before","drop-after"));
    target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest(".arow")||null;
    if(!target||!isArtist(toks[ai[target.dataset.k]]?.name))return;
    after=ev.clientY>target.getBoundingClientRect().top+target.getBoundingClientRect().height/2;
    target.classList.add(after?"drop-after":"drop-before");
  };
  const up=()=>{
    row.removeEventListener("pointermove",move); row.removeEventListener("pointerup",up);
    const toK=target?.dataset.k; clearDropMarks();
    if(active&&toK!=null)reorderArtist(Number(row.dataset.k),Number(toK),after);
  };
  row.addEventListener("pointermove",move); row.addEventListener("pointerup",up);
});

bars.addEventListener("pointerdown",e=>{
  const b=e.target.closest(".bar"); if(!b)return;
  b.setPointerCapture(e.pointerId);
  const k=Number(b.dataset.k), x0=e.clientX, y0=e.clientY;
  let mode=null, target=null, after=false;
  const move=ev=>{
    if(!mode){
      const dx=ev.clientX-x0, dy=ev.clientY-y0;
      if(Math.hypot(dx,dy)<4)return;
      mode=Math.abs(dx)>Math.abs(dy)?"order":"weight";
      b.classList.add("dragging");
    }
    if(mode==="order"){
      document.querySelectorAll(".bar.drop-before,.bar.drop-after").forEach(el=>
        el.classList.remove("drop-before","drop-after"));
      target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest(".bar")||null;
      if(!target)return;
      after=ev.clientX>target.getBoundingClientRect().left+target.getBoundingClientRect().width/2;
      target.classList.add(after?"drop-after":"drop-before");
      return;
    }
    const r=bars.getBoundingClientRect();
    setW(k, LO+((r.bottom-ev.clientY)/(r.height-14))*(HI-LO), true);
  };
  const up=()=>{
    b.removeEventListener("pointermove",move); b.removeEventListener("pointerup",up);
    const toK=target?.dataset.k; clearDropMarks();
    if(mode==="order"&&toK!=null)reorderArtist(k,Number(toK),after);
    else if(mode==="weight")rebuild();
  };
  b.addEventListener("pointermove",move); b.addEventListener("pointerup",up);
});

/*
FEATURE blind-pairwise-tournament
  Candidate labels are hidden from the main A/B decision surface. The user judges images only.
  Sixteen candidates require fifteen decisions. Round capacity is 8, 4, 2, 1 matches.
  Semifinal outcomes later supply first, second, and third place in the standalone-artist flow.

EVENT choose A or B
  1. lock both candidates against double input
  2. color-confirm winner and desaturate loser
  3. move winner thumbnail toward the visible bracket/history destination
  4. write one winner decision
  5. render next match and update all projections

EVENT rollback
  Reopening an earlier match removes every dependent downstream winner, then makes that pair current.

MOCK tournamentPlayers are placeholder chunks and repeated local images.
TODO generate or load real candidates using the frozen seed, probe prompt, model, and generation settings.
*/
const tournamentPlayers=[
  ["차가운 판타지","../resource/original.png",0],
  ["유리빛 인물화","../resource/test.png",24],
  ["선명한 명암","../resource/original.png",-31],
  ["부드러운 채색","../resource/test.png",44],
  ["무채색 의상","../resource/original.png",-12],
  ["강한 선화","../resource/test.png",68],
  ["몽환 배경","../resource/original.png",92],
  ["차분한 색감","../resource/test.png",-54],
  ["옅은 수채","../resource/original.png",14],
  ["금빛 역광","../resource/test.png",118],
  ["푸른 야경","../resource/original.png",166],
  ["고전 삽화","../resource/test.png",-82],
  ["맑은 선화","../resource/original.png",37],
  ["짙은 채도","../resource/test.png",204],
  ["겨울 공기","../resource/original.png",-108],
  ["따뜻한 필름","../resource/test.png",146]
].map((p,id)=>({id,name:p[0],src:p[1],tone:p[2]}));
const tournamentRoundMatches=[8,4,2,1];
let tournamentWinners={};
let tournamentOrder=[];
let tournamentMoving=false;
const reducedMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;

const tKey=(round,match)=>round+"-"+match;
function tCandidates(round,match){
  if(round===0)return [match*2,match*2+1];
  return [tournamentWinners[tKey(round-1,match*2)]??null,
          tournamentWinners[tKey(round-1,match*2+1)]??null];
}
function clearTournamentAfter(round,match){
  let child=match;
  for(let r=round+1;r<4;r++){
    child=Math.floor(child/2);
    const key=tKey(r,child);
    delete tournamentWinners[key];
    tournamentOrder=tournamentOrder.filter(k=>k!==key);
  }
}
function chooseTournament(round,match,player){
  const candidates=tCandidates(round,match), key=tKey(round,match);
  if(!candidates.includes(player))return;
  clearTournamentAfter(round,match);
  if(tournamentWinners[key]===player){
    delete tournamentWinners[key];
    tournamentOrder=tournamentOrder.filter(k=>k!==key);
  }else{
    tournamentWinners[key]=player;
    tournamentOrder=tournamentOrder.filter(k=>k!==key);
    tournamentOrder.push(key);
  }
  renderTournament();
  requestAnimationFrame(animateDuelArrival);
}
function currentTournamentMatch(){
  for(let round=0;round<4;round++)for(let match=0;match<tournamentRoundMatches[round];match++){
    const candidates=tCandidates(round,match);
    if(candidates.every(v=>v!=null)&&tournamentWinners[tKey(round,match)]==null)return {round,match,candidates};
  }
  return null;
}
function tournamentImage(player){
  const p=tournamentPlayers[player];
  return `<img src="${p.src}" alt="" style="filter:hue-rotate(${p.tone}deg) saturate(.86)">`;
}
function tournamentSlot(player,round,match,where){
  if(player==null)return `<span class="${where} empty" aria-hidden="true"></span>`;
  const winner=tournamentWinners[tKey(round,match)];
  const state=winner==null?"live":winner===player?"win":"lose";
  const p=tournamentPlayers[player];
  return `<button class="${where} ${state}" data-t-player="${player}" data-t-round="${round}" data-t-match="${match}" title="${p.name}" aria-label="${p.name}">${tournamentImage(player)}</button>`;
}
function renderBracket(){
  const current=currentTournamentMatch();
  const columns=[];
  const roundLabels=["16강","8강","4강","결승"];
  for(let round=0;round<4;round++){
    const matches=[];
    for(let match=0;match<tournamentRoundMatches[round];match++){
      const candidates=tCandidates(round,match), decided=tournamentWinners[tKey(round,match)]!=null;
      const active=current&&current.round===round&&current.match===match;
      matches.push(`<div class="bmatch${decided?" decided":""}${active?" current":""}">${tournamentSlot(candidates[0],round,match,"bslot")}${tournamentSlot(candidates[1],round,match,"bslot")}</div>`);
    }
    const active=current&&current.round===round;
    const progress=active?`<b>${current.match+1}/${tournamentRoundMatches[round]}</b>`:"";
    columns.push(`<div class="bround${active?" active":""}"><div class="broundhead">${roundLabels[round]}${progress}</div><div class="bcolumn">${matches.join("")}</div></div>`);
  }
  const champion=tournamentWinners["3-0"];
  columns.push(`<div class="bround${champion!=null?" active":""}"><div class="broundhead">우승</div><div class="bcolumn">${champion==null
    ?`<span class="bchamp empty" aria-hidden="true"></span>`
    :`<button class="bchamp done" data-t-player="${champion}" data-t-round="3" data-t-match="0" title="${tournamentPlayers[champion].name}" aria-label="${tournamentPlayers[champion].name}">${tournamentImage(champion)}</button>`}</div></div>`);
  document.getElementById("bracketCanvas").innerHTML=columns.join("");
}
function renderRoundScale(){
  const current=currentTournamentMatch();
  const active=current?current.round:4;
  const labels=["16","8","4","2","◆"];
  const scale=document.getElementById("roundScale");
  scale.style.setProperty("--round-progress",(active/4*80)+"%");
  scale.innerHTML=labels.map((label,i)=>
    `<span class="rmark${i<active?" done":""}${i===active?" on":""}" title="${i<4?label+"강":"우승"}"><i></i><span>${label}</span></span>`
  ).join("");
}
function renderHistory(){
  const resolved=tournamentOrder.filter(key=>tournamentWinners[key]!=null).map((key,index)=>({key,step:index+1}));
  const groups=new Map(), labels=["16강","8강","4강","결승"];
  const addRecord=(round,record)=>{
    if(!groups.has(round))groups.set(round,[]);
    groups.get(round).push(record);
  };
  const current=currentTournamentMatch();
  if(current){
    addRecord(current.round,`<div class="hmatch current" data-step="${resolved.length+1}">${tournamentSlot(current.candidates[0],current.round,current.match,"hslot")}<span class="hvs">◇</span>${tournamentSlot(current.candidates[1],current.round,current.match,"hslot")}</div>`);
  }
  resolved.reverse().forEach(({key,step})=>{
    const [round,match]=key.split("-").map(Number), candidates=tCandidates(round,match);
    const pair=`${tournamentSlot(candidates[0],round,match,"hslot")}<span class="hvs">◇</span>${tournamentSlot(candidates[1],round,match,"hslot")}`;
    addRecord(round,`<div class="hmatch" data-step="${step}">${pair}</div>`);
  });
  const html=[...groups.keys()].sort((a,b)=>b-a).map(round=>{
    const decided=Object.keys(tournamentWinners).filter(key=>Number(key.split("-")[0])===round).length;
    const active=current&&current.round===round;
    return `<section class="hgroup${active?" current":""}" data-round="${round}">`+
      `<div class="hgroup-head"><span>${labels[round]}</span><b>${decided}/${tournamentRoundMatches[round]}</b></div>`+
      `<div class="hgroup-list">${groups.get(round).join("")}</div></section>`;
  }).join("");
  document.getElementById("matchHistory").innerHTML=html;
}
function setDuelCandidate(button,image,player,current){
  delete button.dataset.tPlayer;
  delete button.dataset.tRound;
  delete button.dataset.tMatch;
  button.classList.toggle("empty",player==null);
  if(player==null){
    button.disabled=true;
    image.removeAttribute("src");
    image.alt="";
    image.style.filter="";
    return;
  }
  const p=tournamentPlayers[player];
  button.disabled=!current;
  image.src=p.src;
  image.alt=p.name;
  image.style.filter=`hue-rotate(${p.tone}deg) saturate(.86)`;
  if(current){
    button.dataset.tPlayer=player;
    button.dataset.tRound=current.round;
    button.dataset.tMatch=current.match;
  }
}
function renderDuel(){
  const current=currentTournamentMatch();
  const champion=tournamentWinners["3-0"]??null;
  const candidates=current?current.candidates:[champion,null];
  const round=current?["16","8","4","2"][current.round]:"◆";
  document.getElementById("duelRoundLeft").textContent=round;
  document.getElementById("duelRoundRight").textContent=round;
  setDuelCandidate(document.getElementById("duelLeftPick"),document.getElementById("duelLeftImage"),candidates[0],current);
  setDuelCandidate(document.getElementById("duelRightPick"),document.getElementById("duelRightImage"),candidates[1],current);
}
function tournamentStatus(current){
  if(!current)return `<b>완료</b> · 15/15`;
  const round=["16강","8강","4강","결승"][current.round];
  return `<b>${round}</b> · ${current.match+1}/${tournamentRoundMatches[current.round]} 경기`;
}
function renderTournament(){
  renderBracket(); renderRoundScale(); renderHistory(); renderDuel();
  const current=currentTournamentMatch();
  const status=tournamentStatus(current);
  const seed=selectedSeed?esc(shortName(selectedSeed)):"—";
  document.getElementById("tournamentStatus").innerHTML=`<span>${seed}</span> · ${status}`;
  document.getElementById("bracketStatus").innerHTML=status;
  const count=Object.keys(tournamentWinners).length;
  document.getElementById("bracketCount").textContent=count+"/15";
  document.getElementById("historyCount").textContent=count+"/15";
  document.getElementById("tUndo").disabled=tournamentOrder.length===0;
}
function animateDuelArrival(){
  if(reducedMotion||!document.body.classList.contains("chunkDuel"))return;
  const left=document.getElementById("duelLeftPick"), right=document.getElementById("duelRightPick");
  left.animate([{opacity:.15,transform:"translateX(-22px)"},{opacity:1,transform:"translateX(0)"}],
    {duration:260,easing:"cubic-bezier(.2,.8,.2,1)"});
  right.animate([{opacity:.15,transform:"translateX(22px)"},{opacity:1,transform:"translateX(0)"}],
    {duration:260,easing:"cubic-bezier(.2,.8,.2,1)"});
  document.getElementById("tournamentStatus").animate(
    [{boxShadow:"0 0 0 #f0c44000"},{boxShadow:"0 0 22px #f0c44066"},{boxShadow:"0 0 0 #f0c44000"}],
    {duration:420,easing:"ease-out"});
}
function motionTarget(button){
  const selector=`[data-t-player="${button.dataset.tPlayer}"][data-t-round="${button.dataset.tRound}"][data-t-match="${button.dataset.tMatch}"]`;
  const targets=[...document.querySelectorAll(selector)].filter(el=>el!==button);
  return targets.find(el=>{
    const r=el.getBoundingClientRect();
    return el.classList.contains("bslot")&&r.bottom>40&&r.top<innerHeight;
  })||targets.find(el=>{
    const r=el.getBoundingClientRect(); return r.bottom>40&&r.top<innerHeight;
  })||null;
}
async function animateTournamentChoice(button){
  if(tournamentMoving||button.disabled)return;
  const round=Number(button.dataset.tRound), match=Number(button.dataset.tMatch), player=Number(button.dataset.tPlayer);
  if(reducedMotion){chooseTournament(round,match,player);return}
  tournamentMoving=true;
  document.body.classList.add("tournamentMoving");
  const other=button===document.getElementById("duelLeftPick")
    ?document.getElementById("duelRightPick"):document.getElementById("duelLeftPick");
  button.classList.add("choice-win");
  other.classList.add("choice-lose");
  const source=button.querySelector("img"), from=source.getBoundingClientRect(), target=motionTarget(button);
  let flight=null;
  if(target){
    const to=target.getBoundingClientRect(), token=source.cloneNode();
    token.removeAttribute("id");
    token.alt="";
    token.className="motion-token";
    Object.assign(token.style,{left:from.left+"px",top:from.top+"px",width:from.width+"px",height:from.height+"px",filter:source.style.filter});
    document.body.appendChild(token);
    const dx=to.left-from.left, dy=to.top-from.top, sx=to.width/from.width, sy=to.height/from.height;
    flight=token.animate([
      {transform:"translate(0,0) scale(1)",opacity:1,offset:0},
      {transform:`translate(${dx*.35}px,${dy*.18-18}px) scale(.72)`,opacity:1,offset:.38},
      {transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`,opacity:.94,offset:1}
    ],{duration:520,easing:"cubic-bezier(.25,.75,.2,1)",fill:"forwards"});
    await flight.finished.catch(()=>{});
    token.remove();
  }else{
    await new Promise(resolve=>setTimeout(resolve,320));
  }
  button.classList.remove("choice-win");
  other.classList.remove("choice-lose");
  chooseTournament(round,match,player);
  tournamentMoving=false;
  document.body.classList.remove("tournamentMoving");
}
function tournamentClick(event){
  if(tournamentMoving)return;
  const button=event.target.closest("[data-t-player]");
  if(!button)return;
  chooseTournament(Number(button.dataset.tRound),Number(button.dataset.tMatch),Number(button.dataset.tPlayer));
}
document.getElementById("bracketCanvas").addEventListener("click",tournamentClick);
document.getElementById("matchHistory").addEventListener("click",tournamentClick);
document.getElementById("duelLeftPick").addEventListener("click",e=>animateTournamentChoice(e.currentTarget));
document.getElementById("duelRightPick").addEventListener("click",e=>animateTournamentChoice(e.currentTarget));
document.getElementById("tUndo").onclick=()=>{
  if(tournamentMoving)return;
  const key=tournamentOrder.at(-1); if(!key)return;
  const [round,match]=key.split("-").map(Number);
  delete tournamentWinners[key]; tournamentOrder.pop(); clearTournamentAfter(round,match); renderTournament();
};
function resetTournament(){
  if(tournamentMoving)return;
  tournamentWinners={};
  tournamentOrder=[];
  renderTournament();
}
function startTournament(){
  resetTournament();
  document.body.classList.add("chunkStage","chunkDuel");
  document.body.classList.remove("noF","noR");
  save({noF:false,noR:false});
  requestAnimationFrame(animateDuelArrival);
}
document.getElementById("tReset").onclick=resetTournament;
renderTournament();

// 1단계는 새 화면이 아니라 기존 네 영역의 역할만 바꾼다
document.getElementById("chunkStart").onclick=()=>{
  if(!selectedSeed)return;
  resetTournament();
  document.body.classList.add("chunkStage");
  document.body.classList.remove("chunkDuel");
  document.body.classList.remove("noF","noR");
  save({noF:false,noR:false});
};
document.querySelectorAll(".chunkcard:not(.create)").forEach(card=>card.onclick=startTournament);
document.getElementById("newChunkButton").onclick=startTournament;
document.getElementById("duelExit").onclick=()=>{
  resetTournament();
  document.body.classList.remove("chunkDuel");
};
document.getElementById("chunkBack").onclick=()=>{
  resetTournament();
  document.body.classList.remove("chunkStage","chunkDuel");
};
if(new URLSearchParams(location.search).has("chunk")){
  document.body.classList.add("chunkStage");
  document.body.classList.remove("noF","noR");
}

rebuild();
</script>
<!--
V0.5 ACCEPTANCE MATRIX

01 NO SEED
   GIVEN the prompt contains artist tags but the user has selected none
   THEN #whoA and #chunkSeed show an empty value, #artistPrompt is visible,
   AND #chunkStart is disabled.

02 SELECT SEED
   WHEN the user clicks an artist in #combo, #bars, or #names
   THEN all four projections highlight the same artist,
   AND #artistHero, #danbooruLink, #twitterLink, and the experiment context update.

03 BROWSE CHUNKS
   WHEN #chunkStart is clicked
   THEN .chunk-entry replaces .artist-normal,
   AND #bars plus #names remain visible in the floor,
   AND no old tournament record is visible.

04 INSPECT CHUNK
   WHEN a .chunkcard[data-chunk] is hovered or focused
   THEN #chunkTooltip lists every member in prompt order with two-decimal weight,
   AND its row count equals the card's member count.

05 START TOURNAMENT
   WHEN an existing chunk card or #newChunkButton is clicked
   THEN prior winners are cleared, .duel-left and .duel-right appear,
   #tournamentBracket replaces the graph, and .tournament-history replaces normal history.

06 DECIDE MATCH
   WHEN #duelLeftPick or #duelRightPick is clicked once
   THEN duplicate input is locked during feedback, one winner is stored,
   motion explains where the decision went, and the next available match appears.

07 UNDERSTAND PROGRESS
   DURING a tournament #tournamentStatus and #bracketStatus show round and round-local match index,
   #roundScale and .broundhead agree, and history groups show decided/total counts.

08 ROLLBACK
   WHEN a decided .bslot or .hslot is clicked
   THEN that winner may be changed or removed, dependent later rounds are cleared,
   and every tournament projection rerenders from the same state.

09 CHANGE SEED
   WHEN a different artist is selected during a tournament
   THEN the tournament is cleared and the UI returns to chunk selection for the new seed.

10 COMPLETE
   AFTER fifteen valid decisions
   THEN one champion remains, status shows completion, both history and bracket retain all rounds,
   AND the winning chunk is ready for the future weight-tuning stage.
-->
</body>
</html>
