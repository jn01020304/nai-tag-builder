<!doctype html> <html lang="ko" data-theme="dark"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>Tag Lab v0.5 — 주석형 UI 구현 명세</title> <style>
:root{--bg:#0c0e13;--panel:#151920;--panel2:#1b202a;--line:#252b36;--ink:#dfe4ec;--dim:#7b8494;--hole:#1a1f28;--accent:#f0c440;--sel:#2c4a7a;--fs:13px;--gap:6px;--r:6px;}
html[data-theme="light"]{--bg:#eef0f4;--panel:#ffffff;--panel2:#f3f5f9;--line:#d6dae2;--ink:#1b1f27;--dim:#767f8d;--hole:#e9ecf1;--accent:#d9a712;--sel:#cfe0fb;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI","Malgun Gothic",sans-serif;font-size:var(--fs);line-height:1.5;display:flex;flex-direction:column;overflow:hidden;}
.top{position:relative;flex:0 0 auto;height:40px;display:flex;align-items:center;gap:8px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line);}
.brand{font-weight:700;letter-spacing:-.3px;padding-right:4px}
.chip{display:flex;align-items:center;gap:6px;padding:3px 9px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);color:var(--dim);font-size:.9em;}
.chip b{color:var(--ink);font-weight:600}
.top .spacer{flex:1}
.ico{font:inherit;color:var(--dim);background:transparent;border:1px solid transparent;border-radius:var(--r);padding:3px 8px;cursor:pointer;}
.ico:hover,.ico.on{color:var(--ink);background:var(--panel2);border-color:var(--line)}
.tournament-status{display:none;position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);min-width:148px;padding:4px 12px;border:1px solid #f0c44088;border-radius:var(--r);color:var(--ink);background:var(--panel2);text-align:center;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:0 0 16px #f0c44012;}
.tournament-status span{color:var(--dim);font-weight:600}
.tournament-status b{color:var(--accent)}
body.chunkDuel .tournament-status{display:block}
body.chunkDuel .top-mid{opacity:0;pointer-events:none}
.stage{flex:1 1 auto;display:flex;min-height:0;padding:var(--gap);gap:0}
.col{display:flex;flex-direction:column;min-width:0;min-height:0}
#sideL{flex:0 0 320px}
#mainL{flex:1 1 55%}
#mainR{flex:1 1 45%}
#sideR{flex:0 0 132px}
#center{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0}
.mains{flex:1 1 auto;display:flex;min-width:0;min-height:0}
body.noL #sideL,body.noL #spL{display:none}
body.noR #sideR,body.noR #spR{display:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.panel+.panel{margin-top:var(--gap)}
.phead{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--line);color:var(--dim);font-size:.86em;}
.phead .spacer{flex:1}
.pbody{flex:1 1 auto;min-height:0;overflow:auto;padding:8px}
.pfoot{flex:0 0 auto;border-top:1px solid var(--line);padding:6px 8px}
.hole{height:100%;min-height:48px;border-radius:var(--r);background:var(--hole);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:.85em;text-align:center;padding:8px;}
.split{flex:0 0 var(--gap);cursor:col-resize;position:relative}
.split::after{content:"";position:absolute;inset:0 1px;border-radius:2px}
.split:hover::after{background:var(--accent);opacity:.4}
.split.v{cursor:row-resize}
.split.v::after{inset:1px 0}
.row{display:flex;align-items:center;gap:6px}
.sel{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:3px 6px;}
.tabs{display:flex;gap:2px;flex:0 0 auto}
.tab{font:inherit;color:var(--dim);background:transparent;border:none;padding:4px 9px;border-radius:var(--r) var(--r) 0 0;cursor:pointer;}
.tab.on{color:var(--ink);background:var(--panel2)}
.tabbody{display:none;flex:1 1 auto;min-height:0;flex-direction:column}
.tabbody.on{display:flex}
.ptwrap{flex:0 0 auto;position:relative;overflow:hidden;background:var(--panel2);border:1px solid var(--line);border-radius:0 var(--r) var(--r) var(--r);}
.ptwrap:focus-within{border-color:var(--accent)}
.ptmirror,.pt{position:absolute;inset:0;width:100%;height:100%;font:inherit;font-family:inherit;font-size:inherit;line-height:1.9;padding:8px;border:none;background:transparent;white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word;letter-spacing:inherit;tab-size:2;}
.ptmirror{color:var(--dim);overflow:hidden;pointer-events:none;z-index:0}
.pt{color:transparent;caret-color:var(--ink);resize:none;outline:none;overflow:auto;z-index:1}
.pt::selection{background:var(--sel)}
.ptmirror .tk{border-radius:2px}
.ptmirror .tk.hi{background:var(--sel)}
.ptmirror .tk{position:relative}
.ptmirror .ord{position:absolute;left:0;top:-1.02em;min-width:13px;padding:1px 3px;border:1px solid color-mix(in srgb,currentColor 45%,transparent);border-radius:4px;background:var(--panel);color:inherit;font-size:.58em;font-weight:700;line-height:1;text-align:center;opacity:.9;pointer-events:none;}
.combobar{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 3px 4px;color:var(--dim);font-size:.82em;}
.combobar .spacer{flex:1}
.mini{font:inherit;font-size:.95em;color:var(--dim);background:transparent;border:1px solid var(--line);border-radius:4px;padding:1px 6px;cursor:pointer;}
.mini:hover{color:var(--ink)}
.mini.on{color:var(--ink);background:var(--panel2)}
.pick{flex:1 1 0;min-width:0;font:inherit;font-size:.95em;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 3px;cursor:pointer;}
#combo{flex:1 1 auto;min-height:0;overflow:auto}
.arow{display:flex;align-items:center;gap:5px;padding:1px 3px;border-radius:4px;border-left:3px solid transparent;}
.arow:hover{background:var(--panel2)}
.arow.dragging,.bar.dragging{opacity:.42}
.arow.drop-before{box-shadow:0 -2px 0 var(--accent)}
.arow.drop-after{box-shadow:0 2px 0 var(--accent)}
.arow.hi{background:var(--panel2);border-left-color:var(--c)}
.arow .dot{flex:0 0 8px;height:8px;border-radius:50%;background:var(--c)}
.arow .idx{flex:0 0 20px;color:var(--dim);font-size:.72em;font-variant-numeric:tabular-nums;text-align:right;}
.arow .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9em;color:var(--c);}
.arow.plain .nm{color:var(--dim)}
.arow.top .nm,.arow.bot .nm,.arow.top .w,.arow.bot .w{font-weight:700}
.arow .meta{flex:0 0 auto;color:var(--dim);font-size:.78em;font-variant-numeric:tabular-nums}
.arow .w{flex:0 0 50px;text-align:center;font:inherit;font-size:.9em;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 3px;}
.arow.neg .w{color:#ff8f8f}
.arow .x{flex:0 0 auto;border:none;background:none;color:var(--dim);cursor:pointer;font:inherit}
.arow .x:hover{color:var(--accent)}
.genbtn{width:100%;font:inherit;font-weight:700;color:#20180a;background:var(--accent);border:none;border-radius:var(--r);padding:9px;cursor:pointer;}
.genbtn:hover{filter:brightness(1.08)}
.genbtn:disabled{color:var(--dim);background:var(--panel2);cursor:not-allowed;filter:none}
.canvas{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px;}
.canvas .hole{width:min(100%,420px);aspect-ratio:832/1216;height:auto}
.barbtn{font:inherit;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:3px 8px;cursor:pointer;}
.barbtn:hover{color:var(--ink)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.agrid div{aspect-ratio:3/4;background:var(--hole);border-radius:4px}
.find{width:100%;font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:5px 8px;outline:none;}
.find:focus{border-color:var(--accent)}
.hist{display:flex;flex-direction:column;gap:6px}
.hist div{aspect-ratio:3/4;background:var(--hole);border-radius:4px}
.hist div:first-child{outline:2px solid var(--accent);outline-offset:-2px}
.floor{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;}
body.noF .floor,body.noF #spF{display:none}
.bars{flex:1 1 auto;min-height:0;display:flex;align-items:stretch;gap:2px;padding:14px 10px 0;position:relative;overflow-x:auto;}
.ticks{position:absolute;inset:14px 10px 0;pointer-events:none;z-index:0}
.tickline{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.tickline.major{border-top-style:solid;border-top-color:var(--dim);opacity:.8}
.ticklabel{position:absolute;left:2px;padding:0 3px;border-radius:3px;background:var(--panel);color:var(--dim);font-size:.68em;font-variant-numeric:tabular-nums;transform:translateY(50%);}
.graphinfo{position:absolute;top:10px;right:10px;z-index:6;display:flex;gap:10px;padding:5px 8px;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:5px;color:var(--dim);font-size:.76em;font-variant-numeric:tabular-nums;pointer-events:none;box-shadow:0 4px 14px #0004;}
.graphinfo b{color:var(--ink);font-weight:600}
.bar{flex:1 1 0;min-width:24px;cursor:ns-resize;position:relative;z-index:2}
.bar .stem{position:absolute;left:1px;right:1px;background:var(--c);opacity:.75;min-height:2px}
.bar.pos .stem{border-radius:3px 3px 0 0}
.bar.neg .stem{border-radius:0 0 3px 3px;opacity:.55}
.bar:hover .stem,.bar.hi .stem{opacity:1}
.bar.drop-before{box-shadow:-3px 0 0 var(--accent)}
.bar.drop-after{box-shadow:3px 0 0 var(--accent)}
.bar.hi::before{content:"";position:absolute;inset:0;background:var(--c);opacity:.12;border-radius:3px}
.bar .val{position:absolute;left:0;right:0;text-align:center;font-size:.74em;color:var(--dim);pointer-events:none;z-index:5;}
.bar.hi .val{color:var(--ink)}
.names{flex:0 0 auto;display:flex;gap:2px;padding:3px 10px 6px;overflow-x:auto}
.names span{flex:1 1 0;min-width:24px;text-align:center;font-size:.72em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-top:2px solid var(--c);padding-top:2px;color:var(--dim);cursor:default;}
.names span.hi{color:var(--ink)}
.artistpeek{position:fixed;z-index:100;width:176px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 34px #0009;pointer-events:none;opacity:0;transform:translateY(5px);transition:opacity .08s,transform .08s;}
.artistpeek.on{opacity:1;transform:translateY(0)}
.artistpeek img{display:block;width:100%;aspect-ratio:832/1216;object-fit:cover;border-radius:5px;background:var(--hole);}
.artistpeek .peekname{margin-top:5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artistpeek .peekmeta{color:var(--dim);font-size:.78em}
.artistadd{display:flex;gap:4px;padding:0 3px 6px}
.artistadd input{min-width:0;flex:1;font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:3px 6px;outline:none;}
.artistadd input:focus{border-color:var(--accent)}
.arow.seed{background:color-mix(in srgb,var(--accent) 10%,var(--panel2))}
.arow.seed .idx,.arow.seed .nm{color:var(--accent)}
.bar.seed{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.bar.seed .stem{box-shadow:0 0 0 1px var(--accent),0 0 10px #f0c44033}
.names span.seed{color:var(--accent);font-weight:700}
.ptmirror .tk.seed{box-shadow:inset 0 -1px 0 var(--accent)}
.main-left-normal,.duel-left,.artist-normal,.chunk-entry,.duel-right,.history-normal,.tournament-history{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
.main-left-normal>.panel{flex:1 1 auto}
.duel-left,.chunk-entry,.duel-right,.tournament-history,#tournamentBracket{display:none}
body.chunkStage .artist-normal{display:none}
body.chunkStage .chunk-entry{display:flex}
body.chunkDuel .main-left-normal,body.chunkDuel .chunk-entry{display:none}
body.chunkDuel .duel-left,body.chunkDuel .duel-right{display:flex}
body.chunkDuel .history-normal{display:none}
body.chunkDuel .tournament-history{display:flex}
body.chunkDuel #bars,body.chunkDuel #names{display:none}
body.chunkDuel #tournamentBracket{display:flex}
body.chunkStage #sideR{flex-basis:214px}
.duelpick{position:relative;flex:1 1 auto;min-height:0;padding:8px;overflow:hidden;border:0;background:var(--panel);color:var(--ink);cursor:pointer;}
.duelpick img{display:block;width:100%;height:100%;object-fit:contain;border-radius:5px;background:var(--hole);transition:filter .12s,box-shadow .12s;}
.duelpick:hover img,.duelpick:focus-visible img{box-shadow:0 0 0 1px var(--accent)}
.duelpick:disabled{cursor:default}
body.tournamentMoving .duelpick{pointer-events:none}
body.tournamentMoving #duelExit,body.tournamentMoving #tUndo,body.tournamentMoving #tReset{pointer-events:none;opacity:.3}
.duelpick.choice-win img{box-shadow:0 0 0 2px #5bd197,0 0 30px #5bd19744;transform:scale(1.012);transition:transform .18s ease,box-shadow .18s ease;}
.duelpick.choice-win .duelmark{opacity:1;transform:translate(-50%,0);background:#5bd197}
.duelpick.choice-lose img{filter:grayscale(1)!important;opacity:.28;transform:scale(.975);transition:filter .18s ease,opacity .18s ease,transform .18s ease;}
.duelpick.empty img{display:none}
.duelpick.empty::before{content:"◆";position:absolute;inset:0;display:grid;place-items:center;color:var(--line);font-size:2em;background:var(--hole);}
.duelmark{position:absolute;left:50%;bottom:16px;transform:translate(-50%,4px);width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:#211903;background:var(--accent);opacity:0;transition:opacity .12s,transform .12s;}
.duelpick:hover .duelmark,.duelpick:focus-visible .duelmark{opacity:1;transform:translate(-50%,0)}
.duelround{color:var(--accent);font-variant-numeric:tabular-nums}
.motion-token{position:fixed;z-index:2000;margin:0;padding:0;object-fit:cover;border:2px solid #5bd197;border-radius:5px;box-shadow:0 8px 28px #000a,0 0 22px #5bd19766;pointer-events:none;transform-origin:top left;will-change:transform,opacity;}
@media (prefers-reduced-motion:reduce){
.duelpick img,.duelmark{transition:none!important}
}
.artisthero{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;background:var(--hole);border-radius:5px;overflow:hidden;}
.artisthero img{width:100%;height:100%;object-fit:contain;border-radius:5px}
.artistprompt{color:var(--dim);text-align:center;padding:16px}
.artistlinks{display:flex;gap:5px;margin-left:auto}
.artistlink{color:var(--dim);text-decoration:none;padding:2px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel2);}
.artistlink:hover{color:var(--ink);border-color:var(--accent)}
.chunkintro{flex:0 0 auto;display:flex;align-items:center;gap:6px;margin-bottom:7px;color:var(--dim);font-size:.82em;}
.chunkintro b{color:var(--ink)}
.chunkgrid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(74px,1fr));gap:6px;}
.chunkcard{min-width:0;min-height:0;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:5px;background:var(--hole);color:var(--ink);cursor:default;}
.chunkcard img{width:100%;height:100%;object-fit:cover;display:block}
.chunkcard:nth-child(2) img,.chunkcard:nth-child(7) img{filter:hue-rotate(22deg) saturate(.82)}
.chunkcard:nth-child(3) img,.chunkcard:nth-child(5) img{filter:hue-rotate(-28deg) contrast(1.05)}
.chunkcard:nth-child(4) img,.chunkcard:nth-child(8) img{filter:saturate(.68) brightness(.9)}
.chunkname{position:absolute;left:0;right:0;bottom:0;padding:14px 5px 4px;background:linear-gradient(transparent,#080a0ddd);font-size:.78em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chunkmeta{display:block;color:#aab2c0;font-size:.82em}
.chunkcard.create{display:grid;place-items:center;border-style:dashed;color:var(--dim);background:var(--panel2);text-align:center;}
.chunkcard.create b{display:block;color:var(--ink);margin-top:4px}
.chunkplus{font-size:2em;color:var(--accent);line-height:1}
.chunktooltip{position:fixed;z-index:1000;display:none;min-width:210px;max-width:280px;padding:8px;border:1px solid #f0c44088;border-radius:var(--r);color:var(--ink);background:#11151deF;box-shadow:0 10px 28px #0008;pointer-events:none;backdrop-filter:blur(6px);}
.chunktooltip.on{display:block}
.chunktooltip-head{display:flex;align-items:center;gap:6px;padding:0 2px 6px;color:var(--dim);border-bottom:1px solid var(--line);font-size:.78em;}
.chunktooltip-head b{color:var(--ink);font-size:1.08em}
.chunktooltip-head span{margin-left:auto}
.chunktooltip-list{display:flex;flex-direction:column;gap:3px;padding-top:6px}
.chunktooltip-row{display:grid;grid-template-columns:24px minmax(0,1fr) 44px;align-items:center;gap:6px;min-height:25px;padding:3px 5px;border-radius:4px;background:var(--panel2);}
.chunktooltip-order{color:var(--accent);font-size:.72em;font-variant-numeric:tabular-nums}
.chunktooltip-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chunktooltip-weight{color:var(--ink);text-align:right;font-family:ui-monospace,Consolas,monospace;font-size:.82em}
.chunktooltip-weight.neg{color:#ff8f8f}
.axishead{display:flex;align-items:center;gap:6px;width:100%}
.axisglyph{color:var(--accent);font-size:1.15em}
.axiscount{color:var(--dim);font-variant-numeric:tabular-nums}
.axisbtn{width:24px;height:24px;display:grid;place-items:center;padding:0;color:var(--dim);background:transparent;border:1px solid transparent;border-radius:4px;cursor:pointer;}
.axisbtn:hover{color:var(--ink);background:var(--panel2);border-color:var(--line)}
.axisbtn:disabled{opacity:.25;cursor:default}
.matchhistory{position:relative;display:flex;flex-direction:column;gap:5px;padding-left:12px;min-height:100%;}
.matchhistory::before{content:"";position:absolute;left:4px;top:4px;bottom:4px;border-left:1px solid var(--line);}
.hgroup{position:relative;display:flex;flex-direction:column;gap:4px;padding:5px;border:1px solid var(--line);border-radius:6px;background:color-mix(in srgb,var(--panel2) 48%,transparent);}
.hgroup.current{border-color:#f0c44099;box-shadow:inset 0 0 0 1px #f0c44018}
.hgroup-head{display:flex;align-items:center;gap:5px;min-height:20px;padding:0 2px;color:var(--dim);font-size:.72em;font-variant-numeric:tabular-nums;}
.hgroup-head span{color:var(--ink);font-weight:700}
.hgroup.current .hgroup-head span{color:var(--accent)}
.hgroup-head b{margin-left:auto;color:var(--dim);font-weight:600}
.hgroup-list{display:flex;flex-direction:column;gap:4px}
.hmatch{position:relative;display:grid;grid-template-columns:1fr 14px 1fr;align-items:center;gap:3px;padding:4px;border-radius:5px;background:var(--panel2);}
.hmatch::before{content:attr(data-step);position:absolute;left:-14px;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;display:grid;place-items:center;border-radius:50%;color:var(--dim);background:var(--panel);border:1px solid var(--line);font-size:.58em;}
.hmatch.current::before{color:#211903;background:var(--accent);border-color:var(--accent)}
.hmatch.current{box-shadow:inset 0 0 0 1px #f0c44088}

.hslot.win{border-color:#5bd197;box-shadow:inset 0 0 0 1px #5bd19755}
.hslot.lose img{filter:grayscale(1)!important;opacity:.24}
.hslot.lose{border-color:#303641}
.hslot.live:hover{border-color:var(--accent)}
.hvs{color:var(--dim);text-align:center;font-size:.72em}
#tournamentBracket{flex:1 1 auto;min-height:0;flex-direction:column;padding:7px 10px 7px;}
.brackettools{position:relative;flex:0 0 32px;display:flex;align-items:center;gap:5px;color:var(--dim);font-size:.75em;}
.bracketstatus{position:absolute;left:50%;transform:translateX(-50%);color:var(--ink);font-size:1.08em;font-weight:700;font-variant-numeric:tabular-nums;}
.bracketstatus b{color:var(--accent)}
.bracketcanvas{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(92px,1fr));gap:22px;padding:2px 9px 4px;overflow:auto;}
.bround{min-width:0;min-height:360px;display:flex;flex-direction:column}
.broundhead{flex:0 0 24px;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--dim);font-size:.78em;font-variant-numeric:tabular-nums;}
.broundhead b{color:var(--dim);font-weight:600}
.bround.active .broundhead{color:var(--accent);font-weight:700}
.bround.active .broundhead b{color:var(--ink)}
.bcolumn{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:space-around;gap:3px}
.bmatch{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:3px;}
.bmatch.current{margin:-3px;padding:3px;border-radius:5px;background:#f0c4400b;box-shadow:0 0 0 2px #f0c440bb}
.bround:not(:last-child) .bmatch::after{content:"";position:absolute;left:100%;top:50%;width:23px;border-top:1px solid var(--line);}
.bmatch.decided:hover::before{content:"↶";position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:19px;height:19px;display:grid;place-items:center;border-radius:50%;color:var(--accent);background:#0d1016dd;pointer-events:none;}
.bslot{position:relative;min-width:0;height:38px;padding:0;overflow:hidden;border:1px solid var(--line);border-radius:4px;background:var(--hole);cursor:pointer;}
.bslot img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .12s,opacity .12s}
.bslot.win{border-color:#5bd197;box-shadow:inset 0 0 0 1px #5bd19755}
.bslot.lose img{filter:grayscale(1)!important;opacity:.38}
.bslot.lose{border-color:#303641}
.bslot.live:hover{border-color:var(--accent);transform:translateY(-1px)}
.bslot.empty{cursor:default;border-style:dashed;opacity:.32}
.bchamp{width:min(100%,72px);aspect-ratio:1;align-self:center;padding:0;overflow:hidden;border:1px dashed var(--line);border-radius:50%;background:var(--hole);}
.bchamp img{width:100%;height:100%;object-fit:cover}
.bchamp.done{border:2px solid var(--accent);box-shadow:0 0 20px #f0c44022}
.roundscale{flex:0 0 30px;position:relative;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;margin:0 9px;color:var(--dim);font-size:.7em;text-align:center;}
.roundscale::before{content:"";position:absolute;left:10%;right:10%;top:50%;height:2px;transform:translateY(-50%);background:var(--line);}
.roundscale::after{content:"";position:absolute;left:10%;top:50%;width:var(--round-progress,0%);height:2px;transform:translateY(-50%);background:#5bd197;transition:width .18s ease;}
.rmark{position:relative;z-index:1;display:grid;place-items:center;gap:1px}
.rmark i{width:8px;height:8px;border-radius:50%;background:var(--line);box-shadow:0 0 0 3px var(--panel)}
.rmark.done i{background:#5bd197}
.rmark.on{color:var(--ink)}
.rmark.on i{width:11px;height:11px;background:var(--accent)}
@media (max-width:900px){
.stage{flex-direction:column}
.mains{flex-direction:column}
#sideL,#sideR{flex:0 0 auto;height:200px}
#mainL,#mainR{flex:1 1 auto;min-height:220px}
.split{display:none}
.floor{margin-top:var(--gap)}
.chunkgrid{grid-template-columns:repeat(2,minmax(90px,1fr))}
.bracketcanvas{grid-template-columns:repeat(5,118px);overflow-x:auto}
}

function renderTournament(){renderBracket(); renderRoundScale(); renderHistory(); renderDuel(); const current=currentTournamentMatch(); const status=tournamentStatus(current); const seed=selectedSeed?esc(shortName(selectedSeed)):"—";
document.getElementById("tournamentStatus").innerHTML=`<span>${seed}</span> · ${status}`;
document.getElementById("bracketStatus").innerHTML=status; const count=Object.keys(tournamentWinners).length; document.getElementById("bracketCount").textContent=count+"/15"; document.getElementById("historyCount").textContent=count+"/15"; document.getElementById("tUndo").disabled=tournamentOrder.length===0;}
function animateDuelArrival(){if(reducedMotion||!document.body.classList.contains("chunkDuel"))return; const left=document.getElementById("duelLeftPick"), right=document.getElementById("duelRightPick"); left.animate([{opacity:.15,transform:"translateX(-22px)"},{opacity:1,transform:"translateX(0)"}], {duration:260,easing:"cubic-bezier(.2,.8,.2,1)"}); right.animate([{opacity:.15,transform:"translateX(22px)"},{opacity:1,transform:"translateX(0)"}], {duration:260,easing:"cubic-bezier(.2,.8,.2,1)"}); document.getElementById("tournamentStatus").animate([{boxShadow:"0 0 0 #f0c44000"},{boxShadow:"0 0 22px #f0c44066"},{boxShadow:"0 0 0 #f0c44000"}], {duration:420,easing:"ease-out"});}
function motionTarget(button){
const selector=`[data-t-player="${button.dataset.tPlayer}"][data-t-round="${button.dataset.tRound}"][data-t-match="${button.dataset.tMatch}"]`;
const targets=[...document.querySelectorAll(selector)].filter(el=>el!==button); return targets.find(el=>{const r=el.getBoundingClientRect(); return el.classList.contains("bslot")&&r.bottom>40&&r.top<innerHeight;})||targets.find(el=>{const r=el.getBoundingClientRect(); return r.bottom>40&&r.top<innerHeight;})||null;}
async function animateTournamentChoice(button){if(tournamentMoving||button.disabled)return; const round=Number(button.dataset.tRound), match=Number(button.dataset.tMatch), player=Number(button.dataset.tPlayer); if(reducedMotion){chooseTournament(round,match,player);return}
tournamentMoving=true; document.body.classList.add("tournamentMoving"); const other=button===document.getElementById("duelLeftPick")
?document.getElementById("duelRightPick"):document.getElementById("duelLeftPick"); button.classList.add("choice-win"); other.classList.add("choice-lose"); const source=button.querySelector("img"), from=source.getBoundingClientRect(), target=motionTarget(button); let flight=null; if(target){const to=target.getBoundingClientRect(), token=source.cloneNode(); token.removeAttribute("id"); token.alt=""; token.className="motion-token"; Object.assign(token.style,{left:from.left+"px",top:from.top+"px",width:from.width+"px",height:from.height+"px",filter:source.style.filter}); document.body.appendChild(token); const dx=to.left-from.left, dy=to.top-from.top, sx=to.width/from.width, sy=to.height/from.height; flight=token.animate([{transform:"translate(0,0) scale(1)",opacity:1,offset:0},
{transform:`translate(${dx*.35}px,${dy*.18-18}px) scale(.72)`,opacity:1,offset:.38},
{transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`,opacity:.94,offset:1}
],{duration:520,easing:"cubic-bezier(.25,.75,.2,1)",fill:"forwards"}); await flight.finished.catch(()=>{}); token.remove();}else{await new Promise(resolve=>setTimeout(resolve,320));}
button.classList.remove("choice-win"); other.classList.remove("choice-lose"); chooseTournament(round,match,player); tournamentMoving=false; document.body.classList.remove("tournamentMoving");}
function tournamentClick(event){if(tournamentMoving)return; const button=event.target.closest("[data-t-player]"); if(!button)return; chooseTournament(Number(button.dataset.tRound),Number(button.dataset.tMatch),Number(button.dataset.tPlayer));}
document.getElementById("bracketCanvas").addEventListener("click",tournamentClick);
document.getElementById("matchHistory").addEventListener("click",tournamentClick);
document.getElementById("duelLeftPick").addEventListener("click",e=>animateTournamentChoice(e.currentTarget));
document.getElementById("duelRightPick").addEventListener("click",e=>animateTournamentChoice(e.currentTarget));
document.getElementById("tUndo").onclick=()=>{if(tournamentMoving)return; const key=tournamentOrder.at(-1); if(!key)return; const [round,match]=key.split("-").map(Number); delete tournamentWinners[key]; tournamentOrder.pop(); clearTournamentAfter(round,match); renderTournament();};
function resetTournament(){if(tournamentMoving)return; tournamentWinners={}; tournamentOrder=[]; renderTournament();}
function startTournament(){resetTournament(); document.body.classList.add("chunkStage","chunkDuel"); document.body.classList.remove("noF","noR"); save({noF:false,noR:false}); requestAnimationFrame(animateDuelArrival);}
document.getElementById("tReset").onclick=resetTournament;
renderTournament();
document.getElementById("chunkStart").onclick=()=>{if(!selectedSeed)return; resetTournament(); document.body.classList.add("chunkStage"); document.body.classList.remove("chunkDuel"); document.body.classList.remove("noF","noR"); save({noF:false,noR:false});};
document.querySelectorAll(".chunkcard:not(.create)").forEach(card=>card.onclick=startTournament);
document.getElementById("newChunkButton").onclick=startTournament;
document.getElementById("duelExit").onclick=()=>{resetTournament(); document.body.classList.remove("chunkDuel");};
document.getElementById("chunkBack").onclick=()=>{resetTournament(); document.body.classList.remove("chunkStage","chunkDuel");};
if(new URLSearchParams(location.search).has("chunk")){document.body.classList.add("chunkStage"); document.body.classList.remove("noF","noR");}
rebuild();
</script>
</body> </html>
